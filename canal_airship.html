<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:," />
<title>CRANEWICK CANAL · 飞艇水面降落</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1b1612;font-family:"Baskerville","Georgia",serif;}
  #app{position:fixed;inset:0;}
  canvas{display:block;}
  #load{position:fixed;inset:0;background:radial-gradient(circle at 50% 45%,#3a2d20,#14100c 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8d6ad;letter-spacing:.28em;font-size:13px;z-index:20;transition:opacity .9s;}
  #load b{font-size:19px;letter-spacing:.4em;color:#f2cd84;font-weight:normal;margin-bottom:14px;padding-left:.4em;}
  #load .bar{width:180px;height:1px;background:#3c3126;margin-top:18px;overflow:hidden}
  #load .bar i{display:block;height:100%;width:32%;background:#c98f42;animation:ld 1.25s infinite}
  @keyframes ld{0%{transform:translateX(-110%)}100%{transform:translateX(430%)}}
  #bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:12;width:min(1180px,calc(100vw - 26px));background:linear-gradient(180deg,rgba(31,24,17,.90),rgba(18,14,10,.95));border:1px solid rgba(201,143,66,.52);border-radius:3px;box-shadow:0 12px 34px rgba(0,0,0,.42),inset 0 1px rgba(255,225,172,.08);backdrop-filter:blur(8px);color:#d9c49b;font:12px/1 "Baskerville",Georgia,serif;letter-spacing:.12em;user-select:none;}
  #bar .row{display:flex;align-items:center;gap:9px;padding:8px 11px;min-height:34px;}
  #bar .row+.row{border-top:1px solid rgba(201,143,66,.18);}
  #bar .lbl{color:#9c8869;font-size:11px;letter-spacing:.18em;margin-right:1px;}
  #bar .grp{display:flex;gap:2px;background:rgba(0,0,0,.22);border:1px solid rgba(201,143,66,.22);border-radius:2px;padding:2px;}
  #bar button{background:transparent;color:#cbb68d;border:0;padding:6px 9px;font:inherit;letter-spacing:inherit;cursor:pointer;border-radius:2px;transition:background .18s,color .18s;}
  #bar button:hover{background:rgba(201,143,66,.13);color:#ffe6b8;}
  #bar .grp button.on{background:rgba(201,143,66,.24);color:#ffe6b8;box-shadow:inset 0 0 0 1px rgba(201,143,66,.35);}
  #bar .spacer{flex:1;}
  #playBtn{min-width:54px;text-align:center;border:1px solid rgba(201,143,66,.3)!important;background:rgba(201,143,66,.08)!important;}
  #phaseName{width:74px;color:#f0c985;letter-spacing:.18em;white-space:nowrap;}
  #track{position:relative;flex:1;height:18px;min-width:160px;cursor:pointer;touch-action:none;}
  #track::before{content:"";position:absolute;left:0;right:0;top:8px;height:2px;background:rgba(255,235,200,.14);border-radius:1px;}
  #fill{position:absolute;left:0;top:8px;height:2px;width:0;background:linear-gradient(90deg,#8d6430,#e8bf79);box-shadow:0 0 7px rgba(232,191,121,.35);border-radius:1px;}
  #knob{position:absolute;top:3px;left:0;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#efcd8d;border:1px solid #241a10;box-shadow:0 0 9px rgba(255,196,106,.65);pointer-events:none;}
  #ticks{position:absolute;inset:0;pointer-events:none;}
  #ticks i{position:absolute;top:5px;width:1px;height:8px;background:rgba(233,194,122,.5);}
  #timeLabel{width:86px;text-align:right;color:#a89576;font-size:11px;font-variant-numeric:tabular-nums;letter-spacing:.08em;white-space:nowrap;}
  #qbtn{color:#e6cfa0!important;border:1px solid rgba(201,143,66,.4)!important;padding:7px 11px!important;background:rgba(28,22,16,.4)!important;white-space:nowrap;}
  #qbtn:hover{background:rgba(60,45,28,.85)!important;color:#ffe6b8!important;}
  @media(max-width:820px){
    #bar{font-size:11px;}
    #bar .row{gap:6px;flex-wrap:wrap;}
    #timeLabel{display:none;}
    #phaseName{width:auto;}
  }
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#f0c089;background:#14100c;z-index:30;font-size:14px;padding:30px;text-align:center;line-height:1.9}

</style>
</head>
<body>
<div id="app"></div>
<div id="load"><b>CRANEWICK</b><span>CANAL &amp; AIRSHIP · 场景构建中</span><div class="bar"><i></i></div></div>
<div id="bar">
  <div class="row">
    <span class="lbl">时段</span>
    <div class="grp" id="todBtns">
      <button data-tod="morning">早</button>
      <button data-tod="noon">午</button>
      <button data-tod="dusk" class="on">傍晚</button>
      <button data-tod="midnight">午夜</button>
    </div>
    <span class="lbl">天气</span>
    <div class="grp" id="weatherBtns">
      <button data-w="sun" class="on">晴</button>
      <button data-w="rain">雨</button>
    </div>
    <span class="spacer"></span>
    <button id="qbtn">画质 · 高</button>
  </div>
  <div class="row">
    <button id="playBtn">暂停</button>
    <span id="phaseName">常态</span>
    <div id="track" role="slider" tabindex="0" aria-label="演出进度" aria-valuemin="0" aria-valuemax="60" aria-valuenow="0">
      <div id="fill"></div>
      <div id="knob"></div>
      <div id="ticks"></div>
    </div>
    <span id="timeLabel">00:00 / 01:00</span>
  </div>
</div>
<div id="err"></div>

const orbit = {
  theta: 1.47, phi: 1.43, radius: 38,
  tTheta: 1.47, tPhi: 1.43, tRadius: 38,
  target: new THREE.Vector3(-4, 3.6, 0), down: false, pan: false, lx: 0, ly: 0, moved: 0
};
const el = renderer.domElement;
el.addEventListener('pointerdown', e => {
  if (e.button === 0) orbit.down = true;
  else if (e.button === 2) orbit.pan = true;
  else return;
  orbit.lx = e.clientX; orbit.ly = e.clientY; orbit.moved = 0;
  el.setPointerCapture(e.pointerId);
});
el.addEventListener('pointermove', e => {
  if (!orbit.down && !orbit.pan) return;
  const dx = e.clientX - orbit.lx, dy = e.clientY - orbit.ly;
  orbit.lx = e.clientX; orbit.ly = e.clientY;
  orbit.moved += Math.abs(dx) + Math.abs(dy);
  if (orbit.pan) {
    const k = Math.max(0.0035, orbit.radius * 0.0016);
    const rx = Math.cos(orbit.theta), rz = -Math.sin(orbit.theta);
    orbit.target.x -= rx * dx * k;
    orbit.target.z -= rz * dx * k;
    orbit.target.y += dy * k;
    orbit.target.x = clamp(orbit.target.x, -22.5, 22.5);
    orbit.target.z = clamp(orbit.target.z, -17.2, 17.2);
    orbit.target.y = clamp(orbit.target.y, 0.8, 11.5);
  } else {
    orbit.tTheta -= dx * 0.0052;
    orbit.tPhi = clamp(orbit.tPhi - dy * 0.0045, 0.16, 1.44);
  }
});
function endDrag(e) {
  orbit.down = false; orbit.pan = false;
  if (el.hasPointerCapture(e.pointerId)) el.releasePointerCapture(e.pointerId);
}
el.addEventListener('pointerup', endDrag);
el.addEventListener('pointercancel', endDrag);
el.addEventListener('wheel', e => {
  e.preventDefault();
  // 按 deltaY 的实际幅度连续缩放，触控板细滚与滚轮快滚都无级
  const d = clamp(e.deltaY, -240, 240);
  orbit.tRadius = clamp(orbit.tRadius * Math.exp(d * 0.00135), 4.2, 120);
}, { passive: false });
el.addEventListener('contextmenu', e => e.preventDefault());

function updateCamera(dt) {
  const k = 1 - Math.pow(0.0015, dt);
  orbit.theta += (orbit.tTheta - orbit.theta) * k;
  orbit.phi += (orbit.tPhi - orbit.phi) * k;
  orbit.radius += (orbit.tRadius - orbit.radius) * k;
  const sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
  camera.position.set(
    orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
    orbit.target.y + orbit.radius * cp,
    orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
  );
  camera.lookAt(orbit.target);
}

  }
  // 运河两端不做横跨水面的端墙：水面直接切到模型边缘，露出分层水体截面

    addPlane(g, waterCutMats[sx > 0 ? 1 : 0], BASE.bankIn * 2 + 1.2, 3.57, sx * (BASE.x / 2 + 0.31), -1.335, 0, 0, sx > 0 ? Math.PI * 0.5 : -Math.PI * 0.5, 0, false);
    // 石砌端头只收到两岸，运河口整段留空

  // 底座黄铜名条

  // 临水边缘：石墩/铸铁墩柱（约 3m 间距）+ 悬链线，桥口与入水石阶留缺
  const chainRuns = [
    { s: -1, segs: [[-22.6, 0.7], [9.3, 13.0], [16.2, 22.6]] },
    { s: 1, segs: [[-22.6, 0.7], [9.3, 22.6]] }
  ];
  for (const run of chainRuns) {
    const z = run.s * (BASE.bankIn + 0.32);
    for (const [a, b] of run.segs) {
      const len = b - a;
      const n = Math.max(1, Math.round(len / 2.9));
      const posts = [];
      for (let i = 0; i <= n; i++) {
        const x = a + len * i / n;
        addBox(g, MAT.stone, 0.36, 0.36, 0.36, x, BASE.quayTop + 0.32, z, 0, 0, 0, 0.6, true);
        addBox(g, MAT.slab, 0.42, 0.08, 0.42, x, BASE.quayTop + 0.53, z, 0, 0, 0, 0.5, false);

        posts.push({ x, y: BASE.quayTop + 1.22 });
      }
      for (let i = 0; i < posts.length - 1; i++) {
        const p0 = posts[i], p1 = posts[i + 1];
        const curve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(p0.x, p0.y, z),
          new THREE.Vector3((p0.x + p1.x) / 2, p0.y - 0.27, z),
          new THREE.Vector3(p1.x, p1.y, z)

        const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 8, 0.022, 4, false), MAT.iron);
        tube.castShadow = true;
        g.add(tube);
      }
    }
  }

  // 步道外缘收边带：深色小方石，与内侧浅色大板石区分
  const edgeBandZ = BASE.bankIn + 0.80;
  for (const run of chainRuns) {
    for (const [a, b] of run.segs) {
      const len = b - a, mid = (a + b) / 2;

      const band = addBox(g, MAT.edgePaving, len, 0.03, 0.9, mid, BASE.quayTop + 0.155, run.s * edgeBandZ, 0, 0, 0, 0, false);
      const uv = band.geometry.attributes.uv;
      const rep = len / 1.15;
      for (let i = 8; i < 12; i++) uv.setX(i, uv.getX(i) * rep);
      for (let i = 12; i < 16; i++) uv.setX(i, uv.getX(i) * rep);
      uv.needsUpdate = true;
      band.receiveShadow = true;

  // 穿堤墙泄水孔（仅保留为堤墙细节）

  // 过桥通街：桥台引道 → 短坡 → 小方石车行道 → 底座边缘；两侧留大板石人行边带
  const roadW = 5.2, gapA = BRIDGE_X - 3.6, gapB = BRIDGE_X + 3.6;
  for (const s of [-1, 1]) {
    const zA = s * 12.9, zB = s * 18.15;

    // 车行道（斜坡 + 平段）

    addBox(g, MAT.cobble, roadW, 0.1, 2.95, BRIDGE_X, BASE.quayTop + 0.24, s * 16.65, 0, 0, 0, 0.7, false);

    for (const gx of [2.55, 7.45]) {

      for (const off of [-0.85, 0, 0.85]) {
        addBox(g, MAT.ironDark, 0.34, 0.025, 0.5, gx, BASE.quayTop + 0.289, s * (16.55 + off), 0, 0, 0, 0, false);
        for (let k = 0; k < 4; k++) addBox(g, MAT.iron, 0.28, 0.035, 0.035, gx, BASE.quayTop + 0.292, s * (16.55 + off) - 0.19 + k * 0.12, 0, 0, 0, 0, false);
      }
    }
    // 跨街横幅杆 + 布幡（双面同向，避免背面镜像）
    addCyl(g, MAT.brass, 0.035, 0.035, 7.0, 5.0, 4.8, s * 17.35, 0, 0, Math.PI / 2, 10, true);
    addSphere(g, MAT.brassHi, 0.07, 1.5, 4.8, s * 17.35, 1, 1, 1, false, 8);
    addSphere(g, MAT.brassHi, 0.07, 8.5, 4.8, s * 17.35, 1, 1, 1, false, 8);
    for (const bx of [1.55, 8.45]) addBox(g, MAT.brassLo, 0.18, 0.28, 0.1, bx, 4.8, s * 17.35, 0, 0, 0, 0, false);
    const banner = new THREE.Group();
    for (const face of [1, -1]) {
      const panel = new THREE.Mesh(new THREE.PlaneGeometry(4.0, 0.7), bannerMat);
      panel.position.z = face * 0.008;
      if (face < 0) panel.rotation.y = Math.PI;
      panel.userData.outline = false;
      banner.add(panel);
    }
    banner.position.set(5.0, 4.4, s * 17.31);
    if (s < 0) banner.rotation.y = Math.PI;
    g.add(banner);
    for (const bx of [3.25, 6.75]) addCyl(g, MAT.brass, 0.012, 0.012, 0.12, bx, 4.74, s * 17.31, 0, 0, 0, 4, false);
  }

  // 入水石阶：全场仅南岸一处，顺堤墙侧向入水（踏步沿 x 逐级下降，不垂直插进水面）
  const stairX0 = 13.5, stairStepX = 0.30, stairStepY = 0.30, stairN = 8;
  const stairZ = -8.325, stairDepth = 1.35;
  for (let i = 0; i < stairN; i++) {
    const bx = stairX0 + 0.15 + i * stairStepX;
    const top = BASE.quayTop + 0.12 - i * stairStepY;
    addBox(g, MAT.slab, stairStepX + 0.02, 0.34, stairDepth, bx, top - 0.17, stairZ, 0, 0, 0, 0.5, true);
    // 外侧挡水翻边收窄 2 cm，避免与踏步侧面共面
    addBox(g, MAT.stone, stairStepX - 0.02, 0.46, 0.18, bx, top - 0.05, stairZ + stairDepth / 2 + 0.08, 0, 0, 0, 0.4, true);
    // 实心石砌基座：四向都比踏面收进 2 cm，不再与踏面共面
    const supBottom = -0.9, supTop = top - 0.05, supH = supTop - supBottom;
    addBox(g, MAT.stone, stairStepX - 0.02, supH, stairDepth - 0.04, bx, supBottom + supH / 2, stairZ, 0, 0, 0, 0.4, false);
  }
  // 上端石槛、外挑平台与实心墩座（平台向水面稍稍外扩）
  addBox(g, MAT.stone, 2.55, 0.10, 0.32, stairX0 + 1.22, BASE.quayTop + 0.29, -9.0, 0, 0, 0, 0.4, false);
  const landX = stairX0 - 0.12, landTop = BASE.quayTop + 0.13;
  addBox(g, MAT.stone, 0.72, 3.06, 1.36, landX, 0.63, -8.23, 0, 0, 0, 0.4, true);
  addBox(g, MAT.slab, 0.78, 0.18, 1.60, landX, landTop - 0.09, -8.20, 0, 0, 0, 0.5, true);
  addBox(g, MAT.stone, 0.78, 0.08, 0.14, landX, landTop + 0.04, -7.42, 0, 0, 0, 0.4, false);
  // 外侧斜扶手：立柱 + 斜杆
  const railZ = stairZ + stairDepth / 2 + 0.09;
  addCyl(g, MAT.iron, 0.04, 0.045, 1.0, stairX0 + 0.05, BASE.quayTop + 0.5, railZ, 0, 0, 0, 6, false);
  addCyl(g, MAT.iron, 0.035, 0.04, 0.95, stairX0 + stairN * stairStepX - 0.05, 0.5, railZ, 0, 0, 0, 6, false);
  addCyl(g, MAT.iron, 0.03, 0.035, 0.85, stairX0 + stairN * stairStepX * 0.52, 1.25, railZ, 0, 0, 0, 6, false);
  g.add(makeStrut(new THREE.Vector3(stairX0 + 0.05, BASE.quayTop + 0.98, railZ), new THREE.Vector3(stairX0 + stairN * stairStepX - 0.05, 0.92, railZ), 0.032, MAT.iron));
  addSphere(g, MAT.brassHi, 0.07, stairX0 + 0.05, BASE.quayTop + 1.0, railZ, 1, 1, 1, false, 8);
  // 石阶壁龛灯：背板 + 悬臂 + 灯罩，照亮踏面
  addBox(g, MAT.brassLo, 0.2, 0.26, 0.03, stairX0 + 0.35, BASE.quayTop + 0.44, -8.985, 0, 0, 0, 0, false);

  const stairGlow = new THREE.Sprite(new THREE.SpriteMaterial({

  scene.add(stairGlow);

  // 下水道出水口：完整圆形石砌口，整个圆环都在常水位之上
  function sewer(x, s) {
    const sz = s * (BASE.bankIn - 0.056);
    const sx = new THREE.Group();
    const cy = 0.80, rad = 0.44;
    // 圆形管口贴着石墙：暗色内胆 + 浅凹槽 + 薄石环，整个圆都在常水位之上
    const mouth = new THREE.Mesh(new THREE.CircleGeometry(rad, 40), MAT.culvertDark);
    mouth.position.set(x, cy, sz + s * 0.002);
    mouth.rotation.y = s > 0 ? Math.PI : 0;
    sx.add(mouth);
    const ring = new THREE.Mesh(new THREE.RingGeometry(rad, rad + 0.13, 40, 1), MAT.stone);
    ring.position.set(x, cy, sz - s * 0.001);
    ring.rotation.y = s > 0 ? Math.PI : 0;
    sx.add(ring);
    const lip = new THREE.Mesh(new THREE.RingGeometry(rad - 0.005, rad + 0.02, 40, 1), MAT.ironDark);
    lip.position.set(x, cy, sz - s * 0.003);
    lip.rotation.y = s > 0 ? Math.PI : 0;
    sx.add(lip);
    // 一条窄水舌，不再用半圆下方的大块水片
    addBox(sx, MAT.waterSlice, 0.12, 0.36, 0.02, x, cy - rad - 0.18, sz - s * 0.006, 0, 0, 0, 0, false);

  }
  g.add(sewer(-12.4, 1), sewer(18.4, -1));

  // 系船柱：只出现在飞艇停泊位，每岸 3 个
  for (const s of [-1, 1]) {

      addTorus(g, MAT.brassLo, 0.13, 0.03, x, BASE.quayTop + 0.57, z + s * 0.17, Math.PI / 2, 0, 0, false, 12);
    }
  }

  // 煤气街灯
  for (const s of [-1, 1]) {
    for (const x of [-21, -14, -7, 13, 21]) {
      if (s === 1 && x === -21) continue; // 游园入口前不设街灯，避免遮挡视廊

      addCyl(g, MAT.brassLo, 0.23, 0.3, 0.34, x, BASE.quayTop + 0.17, z, 0, 0, 0, 10, true);
      addCyl(g, MAT.brass, 0.10, 0.16, 3.0, x, BASE.quayTop + 1.8, z, 0, 0, 0, 10, true);
      addCyl(g, MAT.brassHi, 0.20, 0.20, 0.09, x, BASE.quayTop + 0.55, z, 0, 0, 0, 12, false);
      addCyl(g, MAT.brassHi, 0.16, 0.16, 0.08, x, BASE.quayTop + 3.18, z, 0, 0, 0, 12, false);
      // 横臂与吊灯
      addCyl(g, MAT.brass, 0.045, 0.045, 0.62, x, BASE.quayTop + 3.35, z + s * 0.31, Math.PI / 2, 0, 0, 7, false);
      const lz = z + s * 0.62;
      addCyl(g, MAT.brassLo, 0.045, 0.045, 0.34, x, BASE.quayTop + 3.2, lz, 0, 0, 0, 6, false);
      addCyl(g, MAT.lampGlass, 0.23, 0.18, 0.52, x, BASE.quayTop + 2.82, lz, 0, 0, 0, 8, false);
      addCyl(g, MAT.brass, 0.24, 0.05, 0.22, x, BASE.quayTop + 3.2, lz, 0, 0, 0, 8, false);
      addSphere(g, MAT.brassHi, 0.055, x, BASE.quayTop + 3.36, lz, 1, 1, 1, false, 8);
      addTorus(g, MAT.brassLo, 0.215, 0.025, x, BASE.quayTop + 2.58, lz, Math.PI / 2, 0, 0, false, 12);
      // 灯芯发光片 + 光晕
      const glowMat = new THREE.SpriteMaterial({
        map: TEX.glow, color: 0xffc46a, transparent: true, opacity: 0.9,
        blending: THREE.AdditiveBlending, depthWrite: false
      });
      const spr = new THREE.Sprite(glowMat);
      spr.position.set(x, BASE.quayTop + 2.82, lz);
      spr.scale.set(2.6, 2.6, 1);
      scene.add(spr);

      reflectionSeeds.push({ x, z: s * 8.25, color: 0xffc46a, w: 1.45, len: 6.6, opacity: 0.55 });
    }
  }

  bakeInto(g, STATIC);
  return g;
}

  addCyl(src, MAT.copper, 0.22, 0.24, 0.5, 0.93, 0.58, 0, 0, 0, 0, 12, true);
  for (const by of [0.4, 0.7]) addCyl(src, MAT.brass, 0.245, 0.245, 0.05, 0.93, by, 0, 0, 0, 0, 12, false);
  addCyl(src, MAT.brassLo, 0.075, 0.09, 0.52, 1.08, 0.96, 0, 0, 0, 0, 10, false);
  addCyl(src, MAT.brass, 0.13, 0.09, 0.12, 1.08, 1.26, 0, 0, 0, 0, 10, false);

  src.add(makeStrut(new THREE.Vector3(1.3, 0.42, 0), new THREE.Vector3(1.55, 0.72, 0.18), 0.025, MAT.brassHi));
  addCyl(src, MAT.brass, 0.035, 0.035, 0.16, -1.16, 0.38, 0, Math.PI / 2, 0, 0, 6, false);
  addCyl(src, MAT.brass, 0.035, 0.035, 0.16, 1.28, 0.38, -0.18, 0, Math.PI / 2, 0, 6, false);
  for (const bz of [-0.5, 0.5]) addBox(src, MAT.brassLo, 1.95, 0.035, 0.05, 0.08, 0.31, bz, 0, 0, 0, 0, false);
  // 艉灯
  addCyl(src, MAT.brass, 0.03, 0.035, 0.35, 1.25, 0.55, 0, 0, 0, 0, 6, false);
  addCyl(src, MAT.lampGlass, 0.075, 0.06, 0.16, 1.25, 0.8, 0, 0, 0, 0, 8, false);
  addCyl(src, MAT.brass, 0.09, 0.055, 0.05, 1.25, 0.9, 0, 0, 0, 0, 8, false);
  const root = bakeToGroup(src, { outline: 0.02 });
  root.position.set(MOORED_BOAT.x, 0, MOORED_BOAT.z);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: TEX.glow, color: 0xffb45e, transparent: true, opacity: 0.55,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  glow.position.set(1.25, 0.82, 0); glow.scale.set(0.55, 0.55, 1);
  root.add(glow);
  scene.add(root);
  // 艉缆：系到下游系船柱（x=18.2, z=-9.8）
  const ropeCurve = new THREE.CatmullRomCurve3([

  rope.castShadow = false;
  scene.add(rope);
  return {
    group: root, glow,
    update(t) {
      const h = baseWaveHeight(MOORED_BOAT.x, MOORED_BOAT.z, t);
      root.position.y = h * 0.82 - 0.02;
      root.rotation.x = Math.sin(t * 1.35 + 0.45) * 0.022;
      root.rotation.z = Math.sin(t * 1.05 + 1.7) * 0.013;
      glow.material.opacity = 0.5 + 0.08 * Math.sin(t * 2.1);

  };

  addBox(g, MAT.glassDark, w, rectH, 0.02, x, rectY, z + 0.05, 0, 0, 0, 0, false);
  // 黄铜窗棂：三种分格式样
  if (pattern === 0) {
    for (const dx of [-w * 0.25, w * 0.25]) addBox(g, MAT.brass, 0.045, rectH, 0.045, x + dx, rectY, z + 0.06, 0, 0, 0, 0, false);
    for (const dy of [-rectH * 0.18, rectH * 0.18]) addBox(g, MAT.brass, w, 0.045, 0.045, x, rectY + dy, z + 0.06, 0, 0, 0, 0, false);
  } else if (pattern === 1) {
    for (const dx of [-w * 0.19, w * 0.19]) addBox(g, MAT.brass, 0.05, rectH, 0.045, x + dx, rectY, z + 0.06, 0, 0, 0, 0, false);
    addBox(g, MAT.brass, w, 0.05, 0.045, x, rectY + rectH * 0.06, z + 0.06, 0, 0, 0, 0, false);
  } else {
    addBox(g, MAT.brass, 0.05, rectH, 0.045, x, rectY, z + 0.06, 0, 0, 0, 0, false);
    for (const dy of [-rectH * 0.28, 0, rectH * 0.28]) addBox(g, MAT.brass, w, 0.045, 0.045, x, rectY + dy, z + 0.06, 0, 0, 0, 0, false);
  }
  let topY = rectY + rectH / 2;
  // 浅拱窗头
  if (style === 'arch') {
    const r = w * 0.5;
    const archY = rectY + rectH / 2;
    if (lit) {
      const glowDisc = new THREE.Mesh(new THREE.CircleGeometry(r - 0.05, 16, 0, Math.PI), MAT.windowGlow);
      glowDisc.position.set(x, archY, z + 0.04);
      glowDisc.userData.winKey = winKey;
      g.add(glowDisc);
    }
    const glassDisc = new THREE.Mesh(new THREE.CircleGeometry(r, 16, 0, Math.PI), MAT.glassDark);
    glassDisc.position.set(x, archY, z + 0.05); g.add(glassDisc);
    const archFrame = new THREE.Mesh(new THREE.TorusGeometry(r + 0.015, 0.045, 5, 18, Math.PI), MAT.brass);
    archFrame.position.set(x, archY, z + 0.06); g.add(archFrame);
    addBox(g, MAT.brass, 0.04, r, 0.035, x, archY + r * 0.46, z + 0.055, 0, 0, 0, 0, false);
    addBox(g, MAT.stone, 0.22, 0.26, 0.18, x, archY + r + 0.03, z + 0.04, 0, 0, 0, 0, false);
    topY = archY + r;
  }
  addBox(g, MAT.brassHi, w + 0.24, 0.06, 0.12, x, topY + 0.08, z + 0.04, 0, 0, 0, 0, false);
  addBox(g, MAT.slab, w + 0.34, 0.14, 0.34, x, rectY - rectH / 2 - 0.09, z + 0.10, 0, 0, 0, 0.6, false);
  addBox(g, MAT.stone, w + 0.32, 0.22, 0.22, x, topY + 0.22, z + 0.02, 0, 0, 0, 0.5, false);
  // 百叶窗
  if (opts.shutter && opts.shutter !== 'none') {
    const sm = MAT[opts.shutter] || MAT.teal;
    for (const sx of [-1, 1]) {
      const sxp = x + sx * (w * 0.5 + w * 0.20);
      addBox(g, sm, w * 0.34, rectH * 0.94, 0.06, sxp, rectY, z + 0.08, 0, 0, 0, 0.5, false);
      for (let ly = -2; ly <= 2; ly++) {
        addBox(g, MAT.woodDark, w * 0.30, 0.025, 0.02, sxp, rectY + ly * rectH * 0.16, z + 0.115, 0, 0, 0, 0, false);
      }
    }
  }
  // 窗帘
  if (opts.curtain) {
    for (const sx of [-1, 1]) {
      addBox(g, MAT.ivory, 0.16, rectH * 0.58, 0.02, x + sx * w * 0.33, rectY + rectH * 0.14, z + 0.07, 0, 0, 0, 0, false);
    }
  }
  // 窗台花箱
  if (opts.flower) {
    addBox(g, MAT.terracotta, w * 0.92, 0.16, 0.28, x, rectY - rectH / 2 - 0.18, z + 0.18, 0, 0, 0, 0.4, false);
    for (let k = 0; k < 5; k++) {
      const fx = x - w * 0.34 + k * w * 0.17;
      addSphere(g, MAT.plantGreen, 0.11, fx, rectY - rectH / 2 - 0.04, z + 0.22, 1, 1.2, 1, false, 8);
      if (k % 2 === 0) addSphere(g, MAT.burgundy, 0.05, fx + 0.04, rectY - rectH / 2 + 0.09, z + 0.22, 1, 1, 1, false, 6);
    }
  }
  if (balcony) {
    const by = rectY - rectH / 2 - 0.18;
    addBox(g, MAT.iron, w + 0.7, 0.1, 0.78, x, by, z + 0.42, 0, 0, 0, 0, true);
    for (let i = 0; i <= 6; i++) {
      const bx = x - (w + 0.5) / 2 + (w + 0.5) * i / 6;
      addCyl(g, MAT.iron, 0.028, 0.028, 0.72, bx, by + 0.4, z + 0.78, 0, 0, 0, 5, false);
    }
    addCyl(g, MAT.iron, 0.035, 0.035, w + 0.55, x, by + 0.76, z + 0.78, 0, 0, Math.PI / 2, 6, false);
    addCyl(g, MAT.iron, 0.028, 0.028, w + 0.55, x, by + 0.42, z + 0.78, 0, 0, Math.PI / 2, 5, false);
    for (const s of [-1, 1]) {
      const p0 = new THREE.Vector3(x + s * (w * 0.36), by - 0.55, z);
      const p1 = new THREE.Vector3(x + s * (w * 0.36), by, z + 0.62);
      g.add(makeStrut(p0, p1, 0.04, MAT.iron));
    }
  }
}

function addGableWall(g, brick, w, d, h, rise) {
  const shape = new THREE.Shape();
  shape.moveTo(-d / 2, 0); shape.lineTo(d / 2, 0); shape.lineTo(0, rise); shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.2, bevelEnabled: false });
  geo.translate(0, 0, -0.1);
  for (const s of [-1, 1]) {
    const m = new THREE.Mesh(geo, brick);
    m.position.set(s * (w / 2 - 0.02), h, -d / 2);
    m.rotation.y = Math.PI / 2;
    m.castShadow = true; m.receiveShadow = true;
    g.add(m);
  }
}

function buildRoof(g, cfg, brick, w, d, h, chimneyLocals) {
  const type = cfg.roofType || 'gable';
  const rise = cfg.roofRise || 1.5;
  if (type === 'flat') {
    // 平屋顶：女儿墙 + 木水箱 + 检修房 + 锅炉烟道
    addBox(g, MAT.ironDark, w + 0.2, 0.16, d + 0.2, 0, h + 0.08, -d / 2, 0, 0, 0, 0.3, false);
    for (const s of [-1, 1]) {
      addBox(g, brick, w, 0.58, 0.2, 0, h + 0.37, s > 0 ? 0.05 : -d - 0.05, 0, 0, 0, 0.6, true);
      addBox(g, MAT.slab, w + 0.14, 0.09, 0.3, 0, h + 0.70, s > 0 ? 0.05 : -d - 0.05, 0, 0, 0, 0.5, false);
      addBox(g, brick, 0.2, 0.58, d, s * (w / 2 + 0.05), h + 0.37, -d / 2, 0, 0, 0, 0.6, true);
      addBox(g, MAT.slab, 0.3, 0.09, d + 0.14, s * (w / 2 + 0.05), h + 0.70, -d / 2, 0, 0, 0, 0.5, false);
    }
    const tx = w * 0.18, tz = -d * 0.70, ty = h + 0.16;
    for (const lx of [-0.68, 0.68]) for (const lz of [-0.46, 0.46]) {
      addBox(g, MAT.iron, 0.09, 0.92, 0.09, tx + lx, ty + 0.46, tz + lz, 0, 0, 0, 0, false);
    }
    addCyl(g, MAT.woodDark, 0.88, 0.88, 1.2, tx, ty + 1.5, tz, 0, 0, 0, 14, true);
    for (const by of [0.42, 1.0, 1.58]) addTorus(g, MAT.brass, 0.9, 0.028, tx, ty + by, tz, Math.PI / 2, 0, 0, false, 18);
    addCyl(g, MAT.copper, 0.96, 0.56, 0.34, tx, ty + 2.27, tz, 0, 0, 0, 14, false);
    addCyl(g, MAT.brassHi, 0.11, 0.11, 0.16, tx, ty + 2.52, tz, 0, 0, 0, 8, false);
    // 检修小屋
    addBox(g, brick, 1.5, 1.1, 1.4, -w * 0.24, h + 0.62, -d * 0.60, 0, 0, 0, 0.6, true);
    addBox(g, MAT.ironDark, 0.78, 0.86, 0.05, -w * 0.24, h + 0.55, -d * 0.60 + 0.72, 0, 0, 0, 0.3, false);
    addBox(g, MAT.slab, 1.62, 0.08, 1.52, -w * 0.24, h + 1.21, -d * 0.60, 0, 0, 0, 0.5, false);
    // 通气管
    for (const vx of [w * 0.02, w * 0.40]) {
      addCyl(g, MAT.copper, 0.13, 0.13, 1.35, vx, h + 0.78, -d * 0.80, 0, 0, 0, 8, false);
      addCyl(g, MAT.ironDark, 0.24, 0.14, 0.2, vx, h + 1.55, -d * 0.80, 0, 0, 0, 8, false);
      for (const gy of [0.45, 1.0]) addCyl(g, MAT.brassLo, 0.16, 0.16, 0.06, vx, h + gy, -d * 0.80, 0, 0, 0, 10, false);
    }
    addRoofChimney(g, brick, -w * 0.30, -d * 0.72, h + 0.12, chimneyLocals);
    return;
  }
  if (type === 'mansard') {
    // 复折孟莎顶：陡下坡 + 缓上坡 + 砖砌侧颊 + 黄铜脊
    const r1 = rise, r2 = rise * 0.55;
    const zA = d * 0.24, zB = d * 0.50;
    const lenL = Math.hypot(zA, r1), angL = Math.atan2(r1, zA);
    const lenU = Math.hypot(zB - zA, r2), angU = Math.atan2(r2, zB - zA);
    addBox(g, MAT.slate, w + 0.3, 0.13, lenL, 0, h + r1 / 2, -zA / 2, angL, 0, 0, 0.9, true);
    addBox(g, MAT.slate, w + 0.3, 0.13, lenL, 0, h + r1 / 2, -d + zA / 2, -angL, 0, 0, 0.9, true);
    addBox(g, MAT.slate, w + 0.3, 0.12, lenU, 0, h + r1 + r2 / 2, -(zA + zB) / 2, angU, 0, 0, 0.9, true);
    addBox(g, MAT.slate, w + 0.3, 0.12, lenU, 0, h + r1 + r2 / 2, -d + (zA + zB) / 2, -angU, 0, 0, 0.9, true);
    // 端墙按孟莎顶完整轮廓收口：矩形段 + 陡坡三角 + 脊部山尖一次挤出。
    // 原先只砌到檐口线的方形颊墙与五边形屋面轮廓之间会留出两块三角空档，
    // 从侧面直接看穿进室内；墙顶斜边沿瓦面中线走，沉进瓦板厚度内不留缝。
    const endProfile = new THREE.Shape();
    endProfile.moveTo(-d / 2, 0); endProfile.lineTo(d / 2, 0);
    endProfile.lineTo(d / 2 - zA, r1); endProfile.lineTo(0, r1 + r2);
    endProfile.lineTo(zA - d / 2, r1); endProfile.closePath();
    const endGeo = new THREE.ExtrudeGeometry(endProfile, { depth: 0.22, bevelEnabled: false });
    endGeo.translate(0, 0, -0.11);
    for (const s of [-1, 1]) {
      const em = new THREE.Mesh(endGeo, brick);
      em.position.set(s * (w / 2), h, -d / 2);
      em.rotation.y = Math.PI / 2;
      em.castShadow = true; em.receiveShadow = true;
      g.add(em);
    }
    addCyl(g, MAT.brassLo, 0.085, 0.085, w + 0.4, 0, h + r1 + r2 + 0.03, -d / 2, 0, 0, Math.PI / 2, 6, false);
    for (const s of [-1, 1]) {
      addSphere(g, MAT.brassHi, 0.11, s * (w / 2 + 0.18), h + r1 + r2 + 0.10, -d / 2, 1, 1.2, 1, false, 8);
    }
    addRoofChimney(g, brick, w * 0.24, -d * 0.68, h + r1 + r2 * 0.55, chimneyLocals);
    return;
  }
  // 双坡（dormer 在双坡上再加老虎窗）
  const slope = Math.atan2(rise, d / 2);
  const slopeLen = Math.hypot(d / 2, rise);
  addBox(g, MAT.slate, w + 0.3, 0.13, slopeLen, 0, h + rise / 2, -d / 4, slope, 0, 0, 0.9, true);
  addBox(g, MAT.slate, w + 0.3, 0.13, slopeLen, 0, h + rise / 2, -d * 3 / 4, -slope, 0, 0, 0.9, true);
  addCyl(g, MAT.brassLo, 0.09, 0.09, w + 0.5, 0, h + rise + 0.02, -d / 2, 0, 0, Math.PI / 2, 6, false);
  addGableWall(g, brick, w, d, h, rise);
  if (type === 'dormer') {
    // 坡屋面老虎窗：小体量砖砌窗斗 + 人字瓦顶。
    // 正立面 = 砖垛 + 窗 + 砖山花；两侧砖颊墙补到坡面；小屋顶是两片薄瓦板，
    // 前檐与两山坡各挑出山花 0.1 m。后端用砖背墙 + 砖山尖收口——体量只做
    // 一层进深，不再把瓦面一路铺到主屋脊（那会在主坡上留下一条“瓦帆”）。
    const hd = d / 2;
    const roofAt = z => h + rise * Math.max(0, -z) / hd;
    const dw = Math.min(1.40, w * 0.32);
    const winW = dw - 0.50;
    const zF = -hd * 0.33, zB = -hd * 0.77;
    const yF = roofAt(zF), yBack = roofAt(zB);
    const sillY = yF + 0.07;
    const winH = Math.max(0.50, Math.min(0.60, rise * 0.34));
    const headY = sillY + winH + 0.12;
    const eaveY = headY + 0.06;
    const ridgeY = eaveY + 0.46;
    const halfW = dw / 2, roofHalf = halfW + 0.11;
    const zR = zF + 0.12;
    const rAng = Math.atan2(ridgeY - eaveY, roofHalf);
    const rLen = Math.hypot(roofHalf, ridgeY - eaveY) + 0.05;
    for (const s of [-1, 1]) {
      const dx = s * w * 0.27;
      // 颊墙：窗侧砖墙外皮 → 檐口，向下埋进坡面，向上顶到瓦板，补死侧面三角缝
      for (const sx of [-1, 1]) {
        addBox(g, brick, 0.16, eaveY + 0.015 - (yF - 0.30), zR - zB + 0.02,
          dx + sx * (halfW + 0.08), (eaveY + 0.015 + yF - 0.30) / 2, (zR + zB) / 2,
          0, 0, 0, 0.5, true);
      }
      // 正面砖墙：左右砖垛 + 窗下墙 + 窗上过梁墙
      const wallD = 0.22, wallZ = zF - 0.05, wBot = yF - 0.35;
      const jambW = halfW - winW / 2;
      for (const sx of [-1, 1]) {
        addBox(g, brick, jambW, headY - wBot, wallD, dx + sx * (winW / 2 + jambW / 2), (wBot + headY) / 2, wallZ, 0, 0, 0, 0.5, true);
      }
      addBox(g, brick, winW, sillY - wBot, wallD, dx, (wBot + sillY) / 2, wallZ, 0, 0, 0, 0.5, true);
      addBox(g, brick, winW, headY - sillY - winH, wallD, dx, (sillY + winH + headY) / 2, wallZ, 0, 0, 0, 0.5, true);
      // 窗：暖光在里、玻璃在外统一盖面 + 铜棂 + 石窗台/窗楣
      addBox(g, MAT.glassDark, winW, winH, 0.03, dx, sillY + winH / 2, zF + 0.07, 0, 0, 0, 0, false);
      addBox(g, MAT.windowGlow, winW - 0.06, winH - 0.08, 0.03, dx, sillY + winH / 2, zF + 0.062, 0, 0, 0, 0, false);
      addBox(g, MAT.brass, 0.035, winH, 0.035, dx, sillY + winH / 2, zF + 0.08, 0, 0, 0, 0, false);
      addBox(g, MAT.brass, winW, 0.035, 0.035, dx, sillY + winH * 0.56, zF + 0.08, 0, 0, 0, 0, false);
      addBox(g, MAT.slab, dw + 0.10, 0.10, 0.26, dx, sillY - 0.04, zF + 0.07, 0, 0, 0, 0.5, false);
      addBox(g, MAT.slab, winW + 0.16, 0.10, 0.24, dx, headY - 0.02, zF + 0.07, 0, 0, 0, 0.5, false);
      // 封闭山花：过梁 → 脊线，砖砌实心
      const gs = new THREE.Shape();
      gs.moveTo(-halfW - 0.01, 0); gs.lineTo(halfW + 0.01, 0); gs.lineTo(0, ridgeY - headY); gs.closePath();
      const gGeo = new THREE.ExtrudeGeometry(gs, { depth: 0.18, bevelEnabled: false });
      gGeo.translate(0, 0, -0.18);
      const gm = new THREE.Mesh(gGeo, brick);
      gm.position.set(dx, headY, zF + 0.06);
      gm.castShadow = true; gm.receiveShadow = true;
      g.add(gm);
      // 人字瓦顶：两片薄瓦板在脊处相互搭接，前檐和两侧山墙各挑出约 0.1 m
      const k = 0.045 / Math.cos(rAng);
      for (const sx of [-1, 1]) {
        addBox(g, MAT.slate, rLen, 0.09, zR - zB + 0.02,
          dx + sx * roofHalf / 2, (eaveY + ridgeY) / 2 + k, (zR + zB) / 2,
          0, 0, -sx * rAng, 0.9, true);
      }
      addBox(g, MAT.slate, 0.16, 0.06, zR - zB, dx, ridgeY + 0.02, (zR + zB) / 2, 0, 0, 0, 0.9, false);
      // 后端：砖背墙 + 砖山尖，三面封闭
      addBox(g, brick, dw + 0.32, eaveY + 0.02 - (yBack - 0.25), 0.16, dx,
        (eaveY + 0.02 + yBack - 0.25) / 2, zB, 0, 0, 0, 0.5, true);
      const bs = new THREE.Shape();
      bs.moveTo(-halfW - 0.16, 0); bs.lineTo(halfW + 0.16, 0); bs.lineTo(0, ridgeY - eaveY); bs.closePath();
      const bGeo = new THREE.ExtrudeGeometry(bs, { depth: 0.12, bevelEnabled: false });
      bGeo.translate(0, 0, -0.12);
      const bm = new THREE.Mesh(bGeo, MAT.slate);
      bm.position.set(dx, eaveY, zB - 0.02);
      bm.castShadow = true; bm.receiveShadow = true;
      g.add(bm);
      addSphere(g, MAT.brassHi, 0.05, dx, ridgeY + 0.05, zR - 0.05, 1, 1, 1, false, 8);
    }
  }
  addRoofChimney(g, brick, w * 0.24, -d * 0.70, h + rise * 0.58 - 0.5, chimneyLocals);
}

/* ---- 背街面 / 端墙通用构件 ---- */
function addFaceGroup(g, facing, x, y, z) {
  const fg = new THREE.Group();
  fg.position.set(x, y, z);
  if (facing === 'back') fg.rotation.y = Math.PI;
  else if (facing === 'right') fg.rotation.y = Math.PI * 0.5;
  else if (facing === 'left') fg.rotation.y = -Math.PI * 0.5;
  g.add(fg);
  return fg;
}
function addFaceWindow(g, facing, x, y, z, w, h, balcony, opts = {}) {
  const fg = addFaceGroup(g, facing, x, y, z);
  addWindow(fg, 0, 0, 0, w, h, balcony, opts);
  return fg;
}
function addServiceDoor(g, facing, x, z, opts = {}) {
  const dg = addFaceGroup(g, facing, x, 0, z);
  const dw = opts.w || 1.2, dh = opts.h || 2.45, lit = !!opts.lit;
  addBox(dg, MAT.ironDark, dw + 0.26, dh + 0.18, 0.08, 0, (dh + 0.18) / 2, 0.02, 0, 0, 0, 0, false);
  addBox(dg, MAT.woodDark, dw, dh, 0.12, 0, dh / 2, 0.09, 0, 0, 0, 0.7, true);
  for (let i = 0; i < 4; i++) addBox(dg, MAT.wood, dw - 0.14, 0.035, 0.025, 0, 0.45 + i * 0.55, 0.16, 0, 0, 0, 0, false);
  addBox(dg, MAT.glassDark, dw * 0.62, 0.78, 0.03, 0, 1.82, 0.17, 0, 0, 0, 0, false);
  if (lit) addBox(dg, MAT.windowGlow, dw * 0.52, 0.66, 0.02, 0, 1.82, 0.152, 0, 0, 0, 0, false);
  for (const gx of [-dw * 0.18, dw * 0.18]) addBox(dg, MAT.brass, 0.035, 0.78, 0.03, gx, 1.82, 0.19, 0, 0, 0, 0, false);
  addBox(dg, MAT.brass, dw * 0.62, 0.035, 0.03, 0, 1.82, 0.19, 0, 0, 0, 0, false);
  addBox(dg, MAT.brassLo, dw * 0.9, 0.2, 0.03, 0, 0.25, 0.18, 0, 0, 0, 0, false);
  addBox(dg, MAT.brass, dw, 0.05, 0.06, 0, 1.3, 0.17, 0, 0, 0, 0, false);
  addSphere(dg, MAT.brassHi, 0.055, dw * 0.33, 1.18, 0.22, 1, 1, 1, false, 8);
  addBox(dg, MAT.slab, dw + 0.38, 0.16, 0.3, 0, dh + 0.16, 0.1, 0, 0, 0, 0.5, false);
  for (const s of [-1, 1]) {
    addBox(dg, MAT.slab, 0.16, dh + 0.28, 0.26, s * (dw / 2 + 0.13), (dh + 0.28) / 2, 0.1, 0, 0, 0, 0.5, false);
    dg.add(makeStrut(
      new THREE.Vector3(s * dw * 0.29, dh + 0.2, 0.03),
      new THREE.Vector3(s * dw * 0.29, dh + 0.52, 0.55),
      0.03, MAT.iron
    ));
  }
  addBox(dg, MAT.slate, dw + 0.56, 0.08, 0.64, 0, dh + 0.56, 0.36, 0.12, 0, 0, 0.7, true);
  addBox(dg, MAT.stone, dw + 0.5, 0.12, 0.58, 0, 0.06, 0.36, 0, 0, 0, 0.5, false);
  addBox(dg, MAT.brassLo, 0.07, 0.36, 0.07, -dw / 2 - 0.36, 2.95, 0.1, 0, 0, 0, 0, false);
  addBox(dg, MAT.lampGlass, 0.19, 0.28, 0.19, -dw / 2 - 0.36, 2.95, 0.2, 0, 0, 0, 0, false);
  addBox(dg, MAT.brass, 0.3, 0.06, 0.3, -dw / 2 - 0.36, 3.13, 0.2, 0, 0, 0, 0, false);
  addBox(dg, MAT.brassLo, 1.0, 0.32, 0.05, 0, dh + 0.92, 0.12, 0, 0, 0, 0, false);
  const sv = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.22), serviceSignMat);
  sv.position.set(0, dh + 0.92, 0.155);
  sv.userData.outline = false;
  dg.add(sv);
}
function addDownPipe(g, x, z, h, topY) {
  addCyl(g, MAT.copper, 0.055, 0.055, h, x, topY - h / 2, z, 0, 0, 0, 7, false);
  for (let y = topY - 1.1; y > 0.5; y -= 1.35) addCyl(g, MAT.brassLo, 0.1, 0.1, 0.06, x, y, z, 0, 0, 0, 10, false);
  addBox(g, MAT.ironDark, 0.24, 0.18, 0.24, x, 0.18, z, 0, 0, 0, 0, false);
}
function addLadderRun(g, x, z, h) {
  for (const sx of [-0.2, 0.2]) addCyl(g, MAT.iron, 0.028, 0.028, h - 1.0, x + sx, (h - 1.0) / 2 + 0.35, z, 0, 0, 0, 5, false);
  for (let ry = 0.7; ry < h - 0.2; ry += 0.36) addCyl(g, MAT.iron, 0.018, 0.018, 0.44, x, ry, z, 0, 0, Math.PI / 2, 4, false);
  for (let ry = 1.1; ry < h - 0.3; ry += 1.3) for (const sx of [-0.2, 0.2]) addBox(g, MAT.iron, 0.05, 0.05, 0.2, x + sx, ry, z + 0.11, 0, 0, 0, 0, false);
  addCyl(g, MAT.iron, 0.02, 0.02, 0.42, x, h - 0.55, z, 0, 0, Math.PI / 2, 4, false);
}

function buildShop(cfg) {
  const g = new THREE.Group();
  const w = cfg.w, d = cfg.depth, h = 3.5 + cfg.floors * 2.9;
  const brick = MAT[cfg.brick];
  const chimneyLocals = [];
  const shopSeed = Math.abs(Math.round(cfg.x * 13 + (cfg.side > 0 ? 7 : 2)));
  // 基座
  addBox(g, MAT.stone, w + 0.12, 0.5, d + 0.12, 0, 0.25, -d / 2, 0, 0, 0, 0.5, true);
  // 上层实体
  addBox(g, brick, w, h - 3.5, d, 0, 3.5 + (h - 3.5) / 2, -d / 2, 0, 0, 0, 0.55, true);
  // 一层：两侧砖柱 + 店面上楣 + 全进深侧墙/背墙
  addBox(g, brick, 0.9, 3.5, 1.3, -w / 2 + 0.45, 1.75, -0.65, 0, 0, 0, 0.6, true);
  addBox(g, brick, 0.9, 3.5, 1.3, w / 2 - 0.45, 1.75, -0.65, 0, 0, 0, 0.6, true);
  addBox(g, brick, w, 0.5, 1.3, 0, 3.25, -0.65, 0, 0, 0, 0.6, true);
  for (const sx of [-1, 1]) addBox(g, brick, 0.4, 3.5, d, sx * (w / 2 - 0.22), 1.75, -d / 2, 0, 0, 0, 0.6, true);
  addBox(g, brick, w, 3.5, 0.5, 0, 1.75, -d + 0.25, 0, 0, 0, 0.6, true);
  // 店内：全进深地板 / 天花 / 暖光背墙
  addBox(g, MAT.wood, w - 1.8, 0.12, d - 0.45, 0, 0.428, -d / 2, 0, 0, 0, 0.8, false);
  addBox(g, MAT.plasterA, w - 1.8, 0.08, d - 0.45, 0, 3.0, -d / 2, 0, 0, 0, 0.5, false);
  for (const bz of [-d * 0.46, -d * 0.72]) addBox(g, MAT.woodDark, w - 1.9, 0.09, 0.13, 0, 2.935, bz, 0, 0, 0, 0.5, false);
  addBox(g, MAT.interior, w - 1.9, 2.5, 0.04, 0, 1.75, -d + 0.52, 0, 0, 0, 0, false);
  // 店内墙面：抹灰墙板 + 木护墙板 + 黄铜腰线，遮住外侧砖体
  const wallMat = cfg.type === 'book' ? MAT.plasterB : (cfg.type === 'confection' ? MAT.plasterC : MAT.plasterA);
  for (const sx of [-1, 1]) {
    const wx = sx * (w / 2 - 0.44);
    addBox(g, wallMat, 0.03, 2.52, d - 0.12, wx, 1.72, -d / 2 + 0.02, 0, 0, 0, 0.8, false);
    addBox(g, MAT.woodDark, 0.03, 0.90, d - 0.16, sx * (w / 2 - 0.462), 0.95, -d / 2 + 0.02, 0, 0, 0, 0.7, false);
    addBox(g, MAT.brassLo, 0.05, 0.06, d - 0.16, sx * (w / 2 - 0.478), 1.42, -d / 2 + 0.02, 0, 0, 0, 0, false);
    addBox(g, MAT.brassLo, 0.05, 0.05, d - 0.16, sx * (w / 2 - 0.478), 2.91, -d / 2 + 0.02, 0, 0, 0, 0, false);
    // 橱窗前侧砖柱的内侧返墙同样做饰面
    addBox(g, wallMat, 0.03, 2.52, 1.26, sx * (w / 2 - 0.92), 1.72, -0.65, 0, 0, 0, 0.8, false);
    addBox(g, MAT.woodDark, 0.03, 0.90, 1.22, sx * (w / 2 - 0.94), 0.95, -0.65, 0, 0, 0, 0.7, false);
    addBox(g, MAT.brassLo, 0.05, 0.06, 1.22, sx * (w / 2 - 0.955), 1.42, -0.65, 0, 0, 0, 0, false);
  }
  addBox(g, wallMat, w - 0.8, 2.52, 0.03, 0, 1.72, -d + 0.505, 0, 0, 0, 0.8, false);
  addBox(g, MAT.woodDark, w - 1.7, 0.90, 0.03, 0, 0.95, -d + 0.558, 0, 0, 0, 0.7, false);
  addBox(g, MAT.brassLo, w - 1.7, 0.06, 0.03, 0, 1.42, -d + 0.575, 0, 0, 0, 0, false);
  addBox(g, MAT.warmDim, w - 1.9, 0.04, 0.04, 0, 2.95, -d + 0.62, 0, 0, 0, 0, false);
  // 陈列（在玻璃后方）
  const ix = 0.25, iy = 0.5, iz = -0.45, ispan = w - 2.0;
  if (cfg.type === 'hat') displayHats(g, ix, iy, iz, ispan);
  else if (cfg.type === 'cane') displayCanes(g, ix, iy, iz, ispan);
  else if (cfg.type === 'umbrella') displayUmbrellas(g, ix, iy, iz, ispan);
  else if (cfg.type === 'leather') displayLeather(g, ix, iy, iz, ispan);

  if (cfg.roofType === 'gable' || cfg.roofType === 'dormer') {
    const rise = cfg.roofRise || 1.5;
    for (const sx of [-1, 1]) {
      // 山墙外皮在 w/2+0.08；窗组基点必须落在墙皮上，凸出 0.1 会读成悬在半空的窗
      addFaceWindow(g, sx > 0 ? 'right' : 'left', sx * (w / 2 + 0.05), h + rise * 0.4, -d / 2, 0.6, 0.68, false, {
        style: cfg.winStyle, lit: (shopSeed + (sx > 0 ? 1 : 0)) % 2 === 0, pattern: cfg.winPattern,
        shutter: cfg.shutter, curtain: !!cfg.curtain, flower: false
      });
    }
  } else if (cfg.roofType === 'mansard') {
    const rise = cfg.roofRise || 1.9;
    for (const sx of [-1, 1]) {
      addFaceWindow(g, sx > 0 ? 'right' : 'left', sx * (w / 2 + 0.14), h + rise * 0.45, -d / 2, 0.54, 0.62, false, {
        style: cfg.winStyle, lit: false, pattern: cfg.winPattern, shutter: cfg.shutter,
        curtain: !!cfg.curtain, flower: false
      });
    }
  }

  g.position.set(cfg.x, BASE.quayTop, cfg.side > 0 ? BASE.facadeZ : -BASE.facadeZ);
  if (cfg.side > 0) g.rotation.y = Math.PI;
  g.updateMatrixWorld(true);
  for (const p of chimneyLocals) {
    const wp = p.clone().applyMatrix4(g.matrixWorld);
    smokeEmitters.push({ pos: wp, spread: 0.55, rate: 3.2, size: 1.75, life: 6.2, dark: 0.55 });
  }
  for (const gl of shopGlowLocals) {
    gl.obj.position.copy(gl.local.clone().applyMatrix4(g.matrixWorld));
    scene.add(gl.obj);
    shopGlows.push(gl.obj);
  }
  shopGlowLocals.length = 0;
  shopInteriorAnchors.push({
    pos: new THREE.Vector3(winCx, 2.02, -0.95).applyMatrix4(g.matrixWorld),
    seed: shopSeed
  });
  for (const sp of [
    { x: winCx, z: 1.08, w: 3.2, d: 1.75, base: 0.42 },
    { x: doorX - doorW / 2 - 0.22, z: 1.1, w: 1.35, d: 1.55, base: 0.30 }
  ]) {
    const pm = new THREE.MeshBasicMaterial({
      map: TEX.glow, color: 0xffb45e, transparent: true, opacity: sp.base,
      blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false
    });
    const pool = new THREE.Mesh(new THREE.PlaneGeometry(sp.w, sp.d), pm);
    pool.rotation.x = -Math.PI * 0.5;
    pool.position.copy(new THREE.Vector3(sp.x, 0.155, sp.z).applyMatrix4(g.matrixWorld));
    pool.renderOrder = 2;
    shopSpills.push(pool);
    shopGlows.push(pool);
    scene.add(pool);
  }
  const wp = new THREE.Vector3(winCx, 1.9, 0.25).applyMatrix4(g.matrixWorld);
  reflectionSeeds.push({ x: wp.x, z: cfg.side > 0 ? 8.15 : -8.15, color: 0xffb45e, w: 2.1, len: 5.2, opacity: 0.40 });
  return g;
}

function buildClosure(cfg) {
  const g = new THREE.Group();
  const w = cfg.w, d = 4.8;
  const brick = MAT[cfg.kind === 'gable' ? 'brickC' : 'brickB'];
  const glows = [], chimneys = [];

  if (cfg.kind === 'yard') {

    addSphere(g, MAT.brassHi, 0.05, 0.5, 1.2, 0.1, 1, 1, 1, false, 8);
    addBox(g, MAT.ironDark, w - 1.0, 2.5, 0.05, 0, 1.25, -3.9, 0, 0, 0, 0, false);

    addCyl(g, MAT.ironDark, 0.2, 0.24, 0.28, -w * 0.18, 4.9, -3.5, 0, 0, 0, 8, false);

    addBox(g, MAT.windowGlow, 0.72, 0.64, 0.04, w * 0.13, 1.85, -1.79, 0, 0, 0, 0, false);

    addBox(g, MAT.brass, 0.035, 0.72, 0.03, w * 0.13, 1.85, -1.77, 0, 0, 0, 0, false);
    for (const fy of [-0.17, 0.17]) addBox(g, MAT.brass, 0.82, 0.035, 0.03, w * 0.13, 1.85 + fy, -1.77, 0, 0, 0, 0, false);
    glows.push({ local: new THREE.Vector3(0, 1.7, -2.5), scale: [1.3, 1.1], color: 0xffb45e, opacity: 0.32 });

    addBox(g, MAT.slab, w + 0.06, 0.12, 0.5, 0, 3.12, -d + 0.08, 0, 0, 0, 0.5, false);
    addServiceDoor(g, 'back', 0, -d - 0.1, { w: 1.0, h: 2.0, lit: false });
    addFaceWindow(g, 'back', -w * 0.32, 1.85, -d - 0.18, 0.6, 0.78, false, {

    });
    addDownPipe(g, w / 2 - 0.22, -d - 0.12, 2.7, 2.65);
  } else if (cfg.kind === 'arch') {
    // 拱形后巷：砖拱 + 铁栅门 + 深处暖光，上方保持联排体量
    const h = 9.2, open = 1.9, archR = open / 2, archY = 2.7;
    const pier = (w - open) / 2;
    for (const sx of [-1, 1]) {

    }
    addBox(g, brick, w, h - (archY + archR), d, 0, archY + archR + (h - archY - archR) / 2, -d / 2, 0, 0, 0, 0.6, true);
    // 巷内：暗顶、深墙、地面、铁栅门
    addBox(g, MAT.ironDark, open, 0.06, d, 0, archY + archR - 0.02, -d / 2, 0, 0, 0, 0, false);
    addBox(g, MAT.ironDark, open, 3.6, 0.05, 0, 1.8, -d + 0.12, 0, 0, 0, 0, false);

    addCyl(g, MAT.iron, 0.03, 0.03, open - 0.15, 0, 2.2, -0.84, 0, 0, Math.PI / 2, 5, false);
    addCyl(g, MAT.iron, 0.03, 0.03, open - 0.15, 0, 0.8, -0.84, 0, 0, Math.PI / 2, 5, false);
    addTorus(g, MAT.iron, 0.09, 0.02, 0.65, 1.3, -0.8, 0, 0, 0, false, 10);
    // 拱圈与暗拱顶
    const ring = new THREE.Mesh(new THREE.TorusGeometry(archR + 0.06, 0.15, 6, 20, Math.PI), MAT.stone);
    ring.position.set(0, archY, 0.03); ring.castShadow = true; g.add(ring);
    const infill = new THREE.Mesh(new THREE.CircleGeometry(archR, 18, 0, Math.PI), MAT.ironDark);
    infill.position.set(0, archY, -0.02); g.add(infill);
    glows.push({ local: new THREE.Vector3(0, 1.8, -3.5), scale: [1.6, 1.2], color: 0xffb45e, opacity: 0.38 });
    // 上层窗
    for (const wy of [5.1, 7.4]) {
      for (const wx of [-w * 0.24, w * 0.24]) {
        addBox(g, MAT.windowGlow, 0.8, 1.3, 0.03, wx, wy, -0.01, 0, 0, 0, 0, false);

        for (const fx of [-0.22, 0.22]) addBox(g, MAT.brass, 0.03, 1.4, 0.03, wx + fx, wy, 0.04, 0, 0, 0, 0, false);
        addBox(g, MAT.brass, 0.9, 0.035, 0.03, wx, wy + 0.08, 0.04, 0, 0, 0, 0, false);
        addBox(g, MAT.slab, 1.0, 0.12, 0.22, wx, wy - 0.78, 0.08, 0, 0, 0, 0.5, false);

    }
    // 屋顶 + 山墙 + 烟囱
    const rise = 1.5, slope = Math.atan2(rise, d / 2), slopeLen = Math.hypot(d / 2, rise);
    addBox(g, MAT.slate, w + 0.3, 0.13, slopeLen, 0, h + rise / 2, -d / 4, slope, 0, 0, 0.9, true);
    addBox(g, MAT.slate, w + 0.3, 0.13, slopeLen, 0, h + rise / 2, -d * 3 / 4, -slope, 0, 0, 0.9, true);
    for (const sx of [-1, 1]) addBox(g, brick, 0.24, rise, d * 0.96, sx * (w / 2), h + rise / 2 - 0.05, -d / 2, 0, 0, 0, 0.55, true);
    addBox(g, brick, 0.76, 1.7, 0.68, w * 0.22, h + rise + 0.7, -d * 0.7, 0, 0, 0, 0.6, true);
    chimneys.push(new THREE.Vector3(w * 0.22, h + rise + 1.25, -d * 0.7));
    // 后巷收边的背街面：后窗、后门、落水管、检修梯、檐口
    for (const wy of [5.1, 7.4]) {
      for (const bx of [-w * 0.24, w * 0.24]) {
        addFaceWindow(g, 'back', bx, wy, -d - 0.1, 0.72, 1.15, false, {
          style: 'rect', lit: ((Math.abs(cfg.x) * 3 + wy) % 5) > 2, pattern: 1,
          shutter: 'none', curtain: false, flower: false
        });
      }
    }
    addServiceDoor(g, 'back', 0, -d - 0.06, { w: 1.1, h: 2.35, lit: true });
    addDownPipe(g, w / 2 - 0.22, -d - 0.12, h - 0.6, h - 0.3);
    addLadderRun(g, -w / 2 + 0.35, -d - 0.14, h);
    addBox(g, MAT.ironDark, w + 0.2, 0.24, 0.4, 0, h - 0.12, -d - 0.1, 0, 0, 0, 0.4, true);
    addBox(g, MAT.slab, w + 0.05, 0.08, 0.12, 0, 6.25, -d - 0.05, 0, 0, 0, 0.5, false);
  } else {
    // 仓库/锅炉房山墙：铆接钢门、通风管、压力表、吊装梁
    const h = cfg.low ? 5.1 : 7.4, rise = cfg.low ? 1.8 : 2.4;
    addBox(g, brick, w, h, d, 0, h / 2, -d / 2, 0, 0, 0, 0.6, true);
    const tri = new THREE.Shape();
    tri.moveTo(-w / 2, 0); tri.lineTo(w / 2, 0); tri.lineTo(0, rise); tri.closePath();
    // 山墙补回实心厚墙（前后各一片）：原先是零厚度薄片且只糊了临河面，

    const triGeo = new THREE.ExtrudeGeometry(tri, { depth: 0.22, bevelEnabled: false });
    triGeo.translate(0, 0, -0.11);
    for (const gz of [-0.11, -d + 0.11]) {
      const gable = new THREE.Mesh(triGeo, brick);
      gable.position.set(0, h, gz); gable.castShadow = true; gable.receiveShadow = true; g.add(gable);

    addBox(g, MAT.slate, slopeLen, 0.14, d + 0.35, w / 4, h + rise / 2, -d / 2, 0, 0, -slope, 0.9, true);
    addBox(g, MAT.ironDark, 0.1, 0.12, d + 0.4, 0, h + rise + 0.02, -d / 2, 0, 0, 0, 0, false);
    // 铆接钢门 + 门框 + 横梁

    addBox(g, MAT.ironDark, 2.5, 0.18, 0.16, 0, 2.95, 0.09, 0, 0, 0, 0, false);
    addBox(g, MAT.ironDark, 0.18, 3.0, 0.16, -1.25, 1.5, 0.09, 0, 0, 0, 0, false);
    addBox(g, MAT.ironDark, 0.18, 3.0, 0.16, 1.25, 1.5, 0.09, 0, 0, 0, 0, false);
    for (let i = 0; i < 7; i++) for (const sy of [0.4, 1.3, 2.2]) addSphere(g, MAT.brassLo, 0.035, -0.9 + i * 0.3, sy, 0.115, 1, 1, 1, false, 5);
    addCyl(g, MAT.brass, 0.22, 0.22, 0.05, 0.82, 1.45, 0.16, 0, 0, Math.PI / 2, 12, false);
    for (let k = 0; k < 4; k++) addBox(g, MAT.brassHi, 0.16, 0.035, 0.035, 0.82 + Math.cos(k * 1.57) * 0.1, 1.45 + Math.sin(k * 1.57) * 0.1, 0.19, 0, 0, k * 1.57, 0, false);

    for (const sx of [-1, 1]) {

      for (const gy of [1.2, 2.8, 4.4, 6.0]) addCyl(g, MAT.brassLo, 0.2, 0.2, 0.07, px, gy, 0.26, 0, 0, 0, 12, false);

      addCyl(g, MAT.brass, 0.05, 0.05, 0.5, px, 1.7, 0.08, Math.PI / 2, 0, 0, 6, false);
    }
    // 压力表组
    for (const [gx, gy, gr] of [[-1.0, 3.7, 0.2], [-0.35, 4.15, 0.16], [0.7, 3.8, 0.18]]) {
      addCyl(g, MAT.brass, gr, gr, 0.06, gx, gy, 0.06, 0, 0, Math.PI / 2, 14, false);
      addCyl(g, MAT.ironDark, gr * 0.78, gr * 0.78, 0.02, gx, gy, 0.1, 0, 0, Math.PI / 2, 14, false);

    addCyl(g, MAT.brass, 0.2, 0.2, 0.08, 0, 3.55, -1.0, 0, 0, Math.PI / 2, 12, false);
    addCyl(g, MAT.iron, 0.022, 0.022, 0.75, 0, 3.15, -1.0, 0, 0, 0, 4, false);
    addTorus(g, MAT.iron, 0.09, 0.022, 0, 2.75, -1.0, 0, 0, 0, false, 10);
    // 上层小窗 + 后门/管；低矮锅炉房只保留高处铆接检修带
    if (!cfg.low) {
      for (const wx of [-1.3, 1.3]) {

        addBox(g, MAT.brass, 0.04, 1.1, 0.04, wx, 5.5, 0.07, 0, 0, 0, 0, false);
        for (const fy of [-0.28, 0, 0.28]) addBox(g, MAT.brass, 0.86, 0.035, 0.035, wx, 5.5 + fy, 0.07, 0, 0, 0, 0, false);
        addBox(g, MAT.slab, 0.98, 0.1, 0.2, wx, 4.88, 0.07, 0, 0, 0, 0.5, false);
      }
    } else {
      addBox(g, MAT.ironPlate, 2.2, 0.42, 0.07, 0, 4.28, 0.05, 0, 0, 0, 0.5, false);
      for (let i = 0; i < 7; i++) addSphere(g, MAT.brassLo, 0.035, -0.9 + i * 0.3, 4.28, 0.10, 1, 1, 1, false, 5);
    }
    // 背街面：后窗、后门、落水管、检修梯、檐口
    const gs = Math.abs(Math.round(cfg.x * 7));
    for (const bx of [-w * 0.27, w * 0.27]) {
      addFaceWindow(g, 'back', bx, h * 0.68, -d - 0.1, 0.72, 0.96, false, {
        style: 'rect', lit: (gs + (bx > 0 ? 1 : 0)) % 3 === 0, pattern: 2,
        shutter: 'none', curtain: false, flower: false
      });
    }
    addServiceDoor(g, 'back', 0, -d - 0.06, { w: 1.3, h: 2.4, lit: false });
    addDownPipe(g, w / 2 - 0.28, -d - 0.12, h - 0.5, h - 0.2);
    addLadderRun(g, -w / 2 + 0.3, -d - 0.14, h);
    addBox(g, MAT.ironDark, w + 0.2, 0.24, 0.4, 0, h - 0.1, -d - 0.1, 0, 0, 0, 0.4, true);
    addBox(g, MAT.slab, w + 0.05, 0.08, 0.12, 0, h * 0.55, -d - 0.05, 0, 0, 0, 0.5, false);

    for (const sx of [-1, 1]) {

      });

        addFaceWindow(g, sx > 0 ? 'right' : 'left', ex, 5.2, -d * 0.5, 0.7, 0.92, false, {
          style: 'rect', lit: (gs + (sx > 0 ? 1 : 0)) % 2 === 0, pattern: 2,
          shutter: 'none', curtain: false, flower: false
        });

      addBox(g, MAT.slab, 0.3, 0.16, d + 0.12, sx * (w / 2 + 0.06), h - 0.08, -d / 2, 0, 0, 0, 0.5, false);

    }

    addBox(g, brick, 0.8, 1.9, 0.7, w * 0.23, h + rise + 0.55, -d * 0.68, 0, 0, 0, 0.6, true);
    addCyl(g, MAT.ironDark, 0.24, 0.3, 0.3, w * 0.23, h + rise + 1.6, -d * 0.68, 0, 0, 0, 10, false);
    chimneys.push(new THREE.Vector3(w * 0.23, h + rise + 1.75, -d * 0.68));
  }

  g.position.set(cfg.x, BASE.quayTop, cfg.side > 0 ? BASE.facadeZ : -BASE.facadeZ);
  if (cfg.side > 0) g.rotation.y = Math.PI;
  g.updateMatrixWorld(true);
  for (const ch of chimneys) {
    smokeEmitters.push({ pos: ch.clone().applyMatrix4(g.matrixWorld), spread: 0.5, rate: 1.6, size: 1.5, life: 5.4, dark: 0.5 });
  }
  for (const gl of glows) {
    const mat = new THREE.SpriteMaterial({
      map: TEX.glow, color: gl.color, transparent: true, opacity: gl.opacity,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const spr = new THREE.Sprite(mat);
    spr.scale.set(gl.scale[0], gl.scale[1], 1);
    spr.position.copy(gl.local.clone().applyMatrix4(g.matrixWorld));
    scene.add(spr);
    shopGlows.push(spr);
  }
  return g;
}

const puddleUniforms = {

    new THREE.Vector3(12.7, 4.0, 12.85), new THREE.Vector3(19.9, 4.0, 12.85)
  ] }
};
const puddleMasks = [TEX.puddleA, TEX.puddleB, TEX.puddleC];
for (const m of puddleMasks) { m.wrapS = m.wrapT = THREE.ClampToEdgeWrapping; }
const puddleMats = puddleMasks.map(mask => new THREE.ShaderMaterial({
  uniforms: Object.assign({ uMask: { value: mask } }, puddleUniforms),
  transparent: true, depthWrite: false, side: THREE.DoubleSide, fog: false,
  vertexShader: `
    varying vec2 vUv;
    varying vec3 vW;
    void main(){
      vUv = uv;
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vW = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform sampler2D uMask;
    uniform float uTime, uWet, uLamp;
    uniform vec3 uSky, uLampColor, uLightPos[8];
    varying vec2 vUv;
    varying vec3 vW;
    void main(){
      float mask = texture2D(uMask, vUv).a;
      float thr = 0.62 - 0.40 * uWet;
      float m = smoothstep(thr, thr + 0.18, mask) * smoothstep(0.02, 0.22, uWet);
      if (m < 0.008) discard;
      vec2 rip = vec2(sin(vW.x * 19.0 + uTime * 2.3 + vW.z * 3.0), sin(vW.z * 27.0 - uTime * 1.9));
      vec3 N = normalize(vec3(rip.x * 0.032, 1.0, rip.y * 0.028));
      vec3 V = normalize(cameraPosition - vW);
      float fres = pow(1.0 - max(dot(N, V), 0.0), 3.0);
      vec3 col = mix(vec3(0.070, 0.080, 0.090), uSky * 0.85, 0.30 + fres * 0.55);
      float shard = texture2D(uMask, vUv * 2.7 + vec2(0.11, 0.17)).a;
      col *= 0.75 + 0.55 * shard;
      col += uSky * smoothstep(0.30, 0.80, shard) * 0.10;
      float glint = 0.0;
      vec2 vdir = normalize(V.xz + vec2(0.0001, 0.0));
      for (int i = 0; i < 8; i++) {
        vec3 Ld = uLightPos[i] - vW;
        float d2 = dot(Ld, Ld);
        vec3 H = normalize(normalize(Ld) + V);
        float sp = max(dot(N, H), 0.0);
        vec2 hdir = normalize(H.xz + vec2(0.0001, 0.0));
        float along = dot(hdir, vdir);
        float perp = dot(hdir, vec2(-vdir.y, vdir.x));
        float streak = exp(-(along * along * 4.0 + perp * perp * 90.0));
        glint += (streak * 0.16 + pow(sp, 7.0) * 0.06 + pow(sp, 40.0) * 0.55) / (1.0 + 0.10 * d2);
      }
      float breakup = texture2D(uMask, vUv * 1.9 + vec2(uTime * 0.012, uTime * 0.007)).a;
      glint *= 0.30 + 1.10 * breakup;
      col += uLampColor * glint * uLamp * 3.0;
      gl_FragColor = vec4(col, m * (0.55 + 0.22 * fres));
    }
  `
}));

function sailGeo() {
  const segU = 8, segV = 7;
  const pos = [], uv = [], idx = [];

    const v = j / segV;
    const halfTop = 0.53, halfBot = 0.88, y = 0.18 + 2.05 * v;
    const half = lerp(halfBot, halfTop, v);
    for (let i = 0; i <= segU; i++) {

      const bulge = Math.sin(Math.PI * u) * Math.sin(Math.PI * Math.min(1, v * 0.92)) * 0.26 + Math.sin(Math.PI * v) * 0.05;
      pos.push(x, y, bulge);
      uv.push(u, v);
    }

    for (let i = 0; i < segU; i++) {
      const a = j * (segU + 1) + i, b = a + 1, c = a + segU + 1, d = c + 1;

/* ---- 汽船吊舱船体：椭圆船首 / 上翘船尾 / 舷弧 / 木甲板 ---- */
const HULL_N = 32;
const HULL_X0 = -3.12, HULL_X1 = 3.92, HULL_HW = 0.95;
function hullHalfW(x) {
  if (x < -2.45) return HULL_HW * (0.30 + 0.70 * Math.pow(clamp01((x - HULL_X0) / 0.67), 0.72));
  if (x > 2.80) return HULL_HW * Math.pow(clamp01((HULL_X1 - x) / 1.12), 0.62);
  return HULL_HW;
}
function hullKeelY(x) {
  return -0.18 + 0.54 * smoothstep(2.15, HULL_X1, x) + 0.62 * smoothstep(-2.1, HULL_X0, x);
}
function hullSheerY(x) {
  return 1.32 + 0.30 * smoothstep(2.0, HULL_X1, x) + 0.26 * smoothstep(-2.0, HULL_X0, x);
}
function hullSideZAt(x, y) {
  const sy = hullSheerY(x), ky = hullKeelY(x);
  const ff = clamp01((sy - y) / Math.max(0.01, sy - ky));
  const zs = [1, 1, 0.92, 0.62, 0.28, 0], fs = [0, 0.55, 0.78, 0.92, 0.985, 1];
  for (let i = 0; i < 5; i++) {
    if (ff <= fs[i + 1]) return lerp(zs[i], zs[i + 1], (ff - fs[i]) / (fs[i + 1] - fs[i])) * hullHalfW(x);
  }
  return 0;
}
function makeHullGeos() {
  const secZ = [1.0, 1.0, 0.92, 0.62, 0.28, 0];
  const secF = [0, 0.55, 0.78, 0.92, 0.985, 1];
  const ring = [];
  for (let j = 0; j < 6; j++) ring.push([secZ[j], secF[j]]);
  for (let j = 4; j >= 0; j--) ring.push([-secZ[j], secF[j]]);
  const R = ring.length;
  const pos = [], uv = [], idx = [];
  for (let i = 0; i <= HULL_N; i++) {
    const x = lerp(HULL_X0, HULL_X1, i / HULL_N);
    const w = hullHalfW(x), ky = hullKeelY(x), sy = hullSheerY(x);
    for (let j = 0; j < R; j++) {
      const [zf, ff] = ring[j];
      pos.push(x, lerp(sy, ky, ff), zf * w);
      uv.push(i / HULL_N * 4, j / (R - 1));
    }
  }
  for (let i = 0; i < HULL_N; i++) {
    for (let j = 0; j < R - 1; j++) {
      const a = i * R + j, b = a + 1, c = (i + 1) * R + j, d = c + 1;
      idx.push(a, b, c, b, d, c);
    }
  }
  const cap = (i, dir) => {
    const x = i === 0 ? HULL_X0 : HULL_X1;
    const w = hullHalfW(x), ky = hullKeelY(x), sy = hullSheerY(x);
    const base = pos.length / 3;
    pos.push(x, (sy + ky) * 0.5, 0); uv.push(0.5, 0.5);
    for (let j = 0; j < R; j++) {
      const [zf, ff] = ring[j];
      pos.push(x, lerp(sy, ky, ff), zf * w);
      uv.push(zf * 0.4 + 0.5, ff * 0.5);
    }
    for (let j = 0; j < R - 1; j++) {
      const a = base + 1 + j;
      if (dir < 0) idx.push(base, a + 1, a); else idx.push(base, a, a + 1);
    }
  };
  cap(0, -1);
  cap(HULL_N, 1);
  const shell = new THREE.BufferGeometry();
  shell.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  shell.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  shell.setIndex(idx);
  shell.computeVertexNormals();

  const dp = [], du = [], di = [];
  for (let i = 0; i <= HULL_N; i++) {
    const x = lerp(HULL_X0, HULL_X1, i / HULL_N);
    const w = hullHalfW(x) * 0.9, y = hullSheerY(x) - 0.055;
    dp.push(x, y, w, x, y, -w);
    du.push(i / HULL_N * 7, 0, i / HULL_N * 7, 1);
  }
  for (let i = 0; i < HULL_N; i++) {
    const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
    di.push(a, c, b, b, c, d);
  }
  const deck = new THREE.BufferGeometry();
  deck.setAttribute('position', new THREE.Float32BufferAttribute(dp, 3));
  deck.setAttribute('uv', new THREE.Float32BufferAttribute(du, 2));
  deck.setIndex(di);
  deck.computeVertexNormals();
  return { shell, deck };
}

      const gaffGroup = new THREE.Group();

  }

  /* ---- 蒸汽明轮 ×2：10 叶可羽化桨叶 + 摆动臂 + 促动缸 ---- */

  /* ---- 方向舵 / 升降舵（独立铰接，带铰链与推杆） ---- */

  for (const ez of [-0.52, 0, 0.52]) addBox(esrc, MAT.brass, 0.7, 0.085, 0.032, -0.35, 0, ez, 0, 0, 0, 0, false);
  addCyl(esrc, MAT.brass, 0.045, 0.045, 1.56, 0, 0, 0, Math.PI / 2, 0, 0, 8, false);
  addBox(esrc, MAT.brassHi, 0.12, 0.3, 0.08, -0.5, 0.2, 0.55, 0, 0, 0, 0, false);
  const eb = bakeToGroup(esrc, { outline: 0.012 });

  const rudderRod = new THREE.Mesh(unitStrutGeo(0.028, 6), MAT.steel);

  rudderRod.castShadow = elevatorRod.castShadow = true;
  root.add(rudderRod, elevatorRod);
  ship.rudderRod = rudderRod; ship.elevatorRod = elevatorRod;
  ship.rudderAnchor = new THREE.Vector3(-7.64, ENV_CY + 1.02, 0.42);

  ship.elevatorAnchor = new THREE.Vector3(-7.64, ENV_CY + 0.48, 0.94);

  const tailGlow = new THREE.Sprite(new THREE.SpriteMaterial({

  /* ---- 左舷飞轮 + 三级减速齿轮 + 锥齿轮 + 连杆 ---- */
  const flySrc = new THREE.Group();

  addCyl(flySrc, MAT.ironDark, 0.36, 0.36, 0.03, 0, 0, 0.13, Math.PI / 2, 0, 0, 18, false);

  ship.crankCenter = new THREE.Vector3(-2.6, 1.4, -1.12);

  ship.gears = [];
  const gearDefs = [
    { t: 18, r: 0.4, x: -2.15, y: 1.08, z: -1.31, ratio: 1, bevel: false },

  for (const gd of gearDefs) {

  for (const cx of [-2.25, -1.85]) {

  }

  /* ---- 右舷探照灯 ---- */
  const searchGroup = new THREE.Group();
  searchGroup.rotation.order = 'YZX';
  searchGroup.position.set(2.1, 1.62, 1.3);
  const searchSrc = new THREE.Group();
  addCyl(searchSrc, MAT.brass, 0.25, 0.29, 0.66, 0.28, 0, 0, 0, 0, Math.PI / 2, 14, true);
  addCyl(searchSrc, MAT.brassLo, 0.3, 0.3, 0.1, 0.6, 0, 0, 0, 0, Math.PI / 2, 16, false);
  const bowlGeo = new THREE.CylinderGeometry(0.31, 0.17, 0.26, 18, 1, true);
  bowlGeo.rotateZ(-Math.PI / 2);
  const bowl = new THREE.Mesh(bowlGeo, MAT.brassLo);
  bowl.position.x = 0.1;

  searchSrc.add(bowl);
  addBox(searchSrc, MAT.ironDark, 0.2, 0.34, 0.3, -0.1, 0, 0, 0, 0, 0, 0, true);
  addBox(searchSrc, MAT.brass, 0.06, 0.08, 0.08, 0.05, 0.33, 0, 0, 0, 0, 0, false);
  const lens = new THREE.Mesh(new THREE.CircleGeometry(0.27, 18), MAT.warm);
  lens.position.set(0.66, 0, 0); lens.rotation.y = Math.PI / 2;
  searchSrc.add(lens);
  addTorus(searchSrc, MAT.brass, 0.28, 0.03, 0.66, 0, 0, 0, Math.PI / 2, 0, false, 18);
  addTorus(searchSrc, MAT.brassHi, 0.23, 0.016, 0.68, 0, 0, 0, Math.PI / 2, 0, false, 18);
  const searchMesh = bakeToGroup(searchSrc, { outline: 0.015 });
  searchGroup.add(searchMesh);
  // 体积光锥
  const coneGeo = new THREE.ConeGeometry(4.6, 18, 24, 1, true);
  coneGeo.rotateZ(Math.PI / 2);
  coneGeo.translate(9, 0, 0);
  const coneMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    uniforms: { uColor: { value: new THREE.Color('#ffd9a0') }, uOpacity: { value: 0.115 }, uLen: { value: 18 } },
    vertexShader: 'varying float vX; void main(){ vX = position.x; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'uniform vec3 uColor; uniform float uOpacity; varying float vX; void main(){ float t = clamp(vX/18.0,0.0,1.0); float a = uOpacity * smoothstep(0.0,0.06,t) * (1.0-smoothstep(0.15,1.0,t)); gl_FragColor = vec4(uColor,a); }'
  });
  const beam = new THREE.Mesh(coneGeo, coneMat);
  beam.position.x = 0.72;
  beam.frustumCulled = false;
  beam.userData.baseOpacity = 0.08;
  searchGroup.add(beam);
  const beamCore = new THREE.Mesh(coneGeo, coneMat.clone());
  beamCore.material.uniforms.uOpacity.value = 0.11;
  beamCore.scale.set(1, 0.45, 0.45);
  beamCore.position.x = 0.72;
  beamCore.frustumCulled = false;
  beamCore.userData.baseOpacity = 0.11;
  searchGroup.add(beamCore);
  root.add(searchGroup);
  ship.search = searchGroup;
  ship.beamMeshes = [beam, beamCore];
  const spot = new THREE.SpotLight(0xffd9a0, 1.5, 32, 0.30, 0.75, 2);
  spot.castShadow = false;
  scene.add(spot); scene.add(spot.target);
  ship.spot = spot;
  // 探照灯镜头光晕
  const beacon = new THREE.Sprite(new THREE.SpriteMaterial({
    map: TEX.glow, color: 0xffe2b0, transparent: true, opacity: 0.95,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  beacon.position.set(0.72, 0, 0); beacon.scale.set(2.0, 2.0, 1);
  searchGroup.add(beacon);
  ship.beacon = beacon;
  // 吊舱工作灯（带灯柱与灯罩，落在舱顶）
  for (const [wx, wz] of [[2.95, 0.66], [-2.02, -0.66]]) {
    addCyl(root, MAT.brass, 0.05, 0.05, 0.18, wx, 1.84, wz, 0, 0, 0, 8, false);
    addCyl(root, MAT.lampGlass, 0.075, 0.06, 0.1, wx, 1.96, wz, 0, 0, 0, 8, false);
    addCyl(root, MAT.brassLo, 0.1, 0.02, 0.05, wx, 2.02, wz, 0, 0, 0, 8, false);
    const gs = new THREE.Sprite(new THREE.SpriteMaterial({
      map: TEX.glow, color: 0xffc46a, transparent: true, opacity: 0.65,
      blending: THREE.AdditiveBlending, depthWrite: false
    }));
    gs.position.set(wx, 1.97, wz); gs.scale.set(0.62, 0.62, 1);
    root.add(gs);
    ship.fadeSprites.push({ spr: gs, base: 0.65 });
  }
  ship.fadeSprites.push({ spr: beacon, base: 0.95 });
  // 船体蒸汽喷口锚点
  ship.stackLocal = new THREE.Vector3(-1.35, 3.72, -1.0);
  ship.valveLocal = [-1.65, 2.35].map(vx => new THREE.Vector3(vx, ENV_CY + envRawRadiusAt(vx) + 0.38, 0));
  ship.pontoonContacts = [new THREE.Vector3(0.8, -1.9, 1.35), new THREE.Vector3(0.8, -1.9, -1.35)];
  ship.pontoonProbes = [
    new THREE.Vector3(-1.2, -1.86, 1.35), new THREE.Vector3(-1.2, -1.86, -1.35),
    new THREE.Vector3(2.55, -1.78, 1.35), new THREE.Vector3(2.55, -1.78, -1.35)
  ];
  ship.paddleContacts = [new THREE.Vector3(0.5, -1.4, 2.3), new THREE.Vector3(0.5, -1.4, -2.3)];

  /* ---- 材质独立化，供淡入淡出 ---- */
  const matMap = new Map();
  root.traverse(o => {
    if (o.isMesh || o.isSprite) {
      let m = o.material;
      if (Array.isArray(m)) return;
      if (!matMap.has(m)) {
        const c = m.clone();
        if (c.isMeshToonMaterial || c.isMeshBasicMaterial || c.isSpriteMaterial) {
          c.transparent = m.transparent;
        }
        matMap.set(m, c);
      }
      o.material = matMap.get(m);
    }
  });
  for (const [orig, c] of matMap) {
    ship.materials.push({ m: c, op: c.opacity, tr: c.transparent });
  }
  for (const bm of ship.beamMeshes) {
    ship.fadeShaders.push({ uniforms: [bm.material.uniforms], base: [bm.material.uniforms.uOpacity.value] });
  }
  // 船体轮廓材质也要独立
  ship.setFade = function (f) {
    if (ship._fade === f) return;
    ship._fade = f;
    const needTrans = f < 0.999;
    for (const rec of ship.materials) {
      const tr = needTrans || rec.tr;
      if (rec.m.transparent !== tr) { rec.m.transparent = tr; rec.m.needsUpdate = true; }
      rec.m.opacity = rec.op * f;
      if (!rec.tr) rec.m.depthWrite = !needTrans;
    }
    for (const s of ship.fadeSprites) s.spr.material.opacity = s.base * f;
    for (const sh of ship.fadeShaders) {
      for (let i = 0; i < sh.uniforms.length; i++) sh.uniforms[i].uOpacity.value = sh.base[i] * f;
    }
    root.visible = f > 0.002;
  };
  ship.setFade(1);

  ship.getWorldPoint = function (local, out) {
    out = out || new THREE.Vector3();
    return out.copy(local).applyMatrix4(root.matrixWorld);
  };
  ship.update = function (st, dt) {
    root.position.set(st.x, st.y, st.z || 0);
    root.rotation.set(st.roll || 0, st.yaw || 0, st.pitch || 0, 'YZX');
    ship.setFade(st.fade === undefined ? 1 : st.fade);
    const beamFade = (st.fade === undefined ? 1 : st.fade) * (st.beamOn === false ? 0 : 1);
    for (const bm of ship.beamMeshes) bm.material.uniforms.uOpacity.value = bm.userData.baseOpacity * beamFade;
    ship.beacon.visible = beamFade > 0.01;
    // 帆 / 桅杆：脚杆下摆 → 帆布卷成布卷 → 双关节折桅
    const deploy = st.sailDeploy === undefined ? 1 : st.sailDeploy;
    const furl = st.sailFurl === undefined ? deploy : st.sailFurl;
    const furlP = 1 - furl;
    const fold = 1 - deploy;
    const boomDrop = smoothstep(0.02, 0.30, furlP);
    const gaffDrop = smoothstep(0.22, 0.70, furlP);
    const canvasF = smoothstep(0.18, 0.95, furlP);
    for (const mst of ship.masts) {
      mst.group.rotation.x = mst.side * (3 + 9 * deploy) * DEG;
      mst.group.rotation.z = fold * 1.12;
      mst.upper.rotation.x = mst.side * (2 + 5 * deploy) * DEG;
      mst.upper.rotation.z = fold * 0.50;
      mst.boomGroup.rotation.z = lerp(0.03, 1.42, boomDrop);
      mst.gaffGroup.rotation.z = lerp(-0.14, 1.26, gaffDrop);
      if (Math.abs(canvasF - (mst._canvasF === undefined ? -1 : mst._canvasF)) > 0.0005) {
        const pos = mst.sail.geometry.attributes.position;
        const arr = pos.array, base = mst.sailBase;
        for (let i = 0; i < arr.length; i += 3) {
          const bx = base[i], bz = base[i + 2];
          const u = clamp01((0.88 - bx) / 1.76);
          const ang = u * canvasF * 3.8 * Math.PI;
          const r = 0.16 + 0.08 * (1 - u);
          const tx = 0.78 + Math.cos(ang) * r;
          const tz = Math.sin(ang) * r * mst.side;
          arr[i] = bx + (tx - bx) * canvasF;
          arr[i + 2] = bz + (tz - bz) * canvasF +

    ship.paddleWorld = ship.paddleContacts.map(v => ship.getWorldPoint(v, new THREE.Vector3()));

function updateStage(dt) {
  const target = STAGE_TARGETS[stage.tod][stage.rain ? 'rain' : 'sun'];
  const k = 1 - Math.exp(-dt * 3.0);
  for (const key of STAGE_COLORS) stageCur[key].lerp(target[key], k);
  for (const key of STAGE_NUMS) stageCur[key] += (target[key] - stageCur[key]) * k;
  stageCur.sunPos.lerp(target.sunPos, k);
  let settled = stageCur.sunPos.distanceToSquared(target.sunPos) < 2e-5;
  if (settled) {
    for (const key of STAGE_COLORS) {
      if (Math.abs(stageCur[key].r - target[key].r) + Math.abs(stageCur[key].g - target[key].g) + Math.abs(stageCur[key].b - target[key].b) > 0.004) { settled = false; break; }
    }
  }
  if (settled) {
    for (const key of STAGE_NUMS) {
      if (Math.abs(stageCur[key] - target[key]) > 0.003) { settled = false; break; }
    }
  }
  if (settled) copyStage(target);
  if (target.star > 0.5) winMidnight += (1 - winMidnight) * k;
  else if (target.lamp > 0.1 || stageCur.lamp < 0.08) winMidnight += (0 - winMidnight) * k;
  const pw = clamp(stageCur.wet, 0, 1);
  const kp = 1 - Math.exp(-dt * (pw > puddleWet ? 2.6 : 0.9));
  puddleWet += (pw - puddleWet) * kp;
  if (puddleWet < 0.002) puddleWet = 0;
  puddleUniforms.uWet.value = puddleWet;
  puddleUniforms.uTime.value += dt;
  const puddleOn = puddleWet > 0.03;
  for (const p of puddleMeshes) p.visible = puddleOn;
  applyStage();
}

  if (!FREEZE && !paused) elapsed += dtRaw * SPEED;
  const t = elapsed % CYCLE;
  if (t < lastT - 0.02) {

    resetTransientState();

  wallTime += dtRaw;
  updateCamera(dtRaw);

  updateWorld(t, dtSim);

}

window.CRANEWICK = {
  scene, camera, renderer, ship, bridge, splash, wake, waterMat, waterField, mistPool, touchState, TEX, orbit,
  stage, stageCur, sun, hemi, skyMat, MAT, stars, moon, rainMesh, lampSprites, shopGlows, reflections, waterCutMats,
  shopInteriorLights, shopInteriorAnchors, shopSpills, puddleUniforms, puddleMeshes,
  // 烘焙钩子（_scratch/studio_seg4/bake_seg4.mjs）：整合型动画（螺旋桨自转/飞轮/连杆/明轮）
  // 只在 update 内部按 dt 累加，暂停驱动的逐帧烘焙拿不到位移，故把这两个入口暴露出来。
  updateWorld, shipStateAt,
  setOrbit: (o) => {
    const { target, ...rest } = o;
    Object.assign(orbit, rest);
    if (target) {
      if (Array.isArray(target)) orbit.target.set(target[0], target[1], target[2]);
      else if (target.isVector3) orbit.target.copy(target);
    }
    if (o.theta !== undefined) orbit.tTheta = o.theta;
    if (o.phi !== undefined) orbit.tPhi = o.phi;
    if (o.radius !== undefined) orbit.tRadius = o.radius;
  },
  setTime: (v) => seekTime(v),
  setPaused,
  getTime: () => elapsed % CYCLE,
  getPaused: () => paused,
  stats: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles })
};

window.addEventListener('error', e => {
  const err = document.getElementById('err');
  err.style.display = 'flex';
  err.textContent = '运行错误：' + (e.message || e.error || 'unknown');
});
window.addEventListener('unhandledrejection', e => {
  const err = document.getElementById('err');
  err.style.display = 'flex';
  err.textContent = '运行错误：' + (e.reason && e.reason.message || e.reason || 'unknown');
});

updateCamera(1);
seekTime(START_T);
updateWorld(START_T, 1 / 60);
renderer.render(scene, camera);
requestAnimationFrame(() => {
  const el = document.getElementById('load');
  el.style.opacity = '0';
  setTimeout(() => el.remove(), 1100);
});
animate();
</script>
</body>
</html>
