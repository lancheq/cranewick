<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRANEWICK · 单体 ④ 车辆与行人</title>
<style>
  html,body{margin:0;height:100%;background:#10141a}
  canvas{display:block}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    color:#D9B26A;font:13px/1.6 "SF Mono",Menlo,monospace;letter-spacing:.1em;z-index:99;
    background:#10141a;transition:opacity .4s}#boot.gone{opacity:0;pointer-events:none}
  #err{position:fixed;inset:0;display:none;padding:40px;color:#E2913C;
    font:12px/1.7 "SF Mono",Menlo,monospace;white-space:pre-wrap;overflow:auto;z-index:100}
  #panel{position:fixed;left:14px;bottom:74px;width:300px;background:rgba(18,22,29,.9);
    border:1px solid rgba(217,178,106,.28);border-radius:8px;padding:10px 12px;z-index:6;
    font:11.5px/1.5 "SF Mono",Menlo,Consolas,"PingFang SC",monospace;color:#E8E4DC}
  #panel h3{margin:0 0 6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:#D9B26A;font-weight:600}#panel h3:not(:first-child){margin-top:9px}
  #panel .r{display:flex;align-items:center;gap:8px;margin:3px 0}
  #panel .lb{color:#9AA3AD;font-size:10.5px;width:44px}
  #panel input[type=range]{flex:1;accent-color:#D9B26A}
  #panel .st{color:#9AA3AD;font-size:10.5px;width:62px;text-align:right}
  #panel .btns{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
  #panel button{flex:1 1 auto;min-width:60px;padding:4px 6px;font:inherit;font-size:10.5px;cursor:pointer;
    background:rgba(217,178,106,.07);color:#E8E4DC;border:1px solid rgba(217,178,106,.28);border-radius:5px}
  #panel button:hover{background:rgba(217,178,106,.18)}
  #panel button.on{background:#D9B26A;color:#14181e;border-color:#D9B26A;font-weight:600}
</style>
<script type="importmap">
{"imports":{"three":"../vendor/three.module.js","three/addons/":"../vendor/jsm/"}}
</script>
</head>
<body>
<div id="boot">正在装配车辆与行人 …</div>
<pre id="err"></pre>

<script type="module">
import * as THREE from 'three';
import { createViewer } from '../src/core/viewer.js?v=20260915162141';
import * as Vehicles from '../src/assets/vehicles.js?v=20260915162141';

const showErr = (m) => { const el = document.getElementById('err'); el.style.display='block'; el.textContent += m + '\n\n'; };
window.addEventListener('error', (e) => showErr(`${e.message}\n  ${e.filename}:${e.lineno}`));
window.addEventListener('unhandledrejection', (e) => showErr('Promise: ' + (e.reason?.stack || e.reason)));

const V = Vehicles.SPEC;
let board;

// 三型位置与 vehicles.build() 的摆位一致：马车 −9.5 / 机动车 −1.0 / 公共马车 +8.0
const VIEWS = {
  透视: { pos: [12, 6.5, -22], tgt: [0, 1.6, -1] },
  蒸汽机动车: { pos: [-1.0, 3.2, 3.4], tgt: [-1.0, 1.4, -3.4] },
  蒸汽马车: { pos: [-9.5, 3.0, 3.2], tgt: [-9.5, 1.3, -3.4] },
  双层公共马车: { pos: [8.0, 4.2, 6.4], tgt: [8.0, 1.8, 0.4] },
  车轮近景: { pos: [-1.0, 1.1, 2.4], tgt: [-1.0, 0.6, -3.4] },
  行人: { pos: [-6.5, 2.1, 7.4], tgt: [-6.5, 1.0, 2.8] },
};

const viewer = createViewer({
  title: '④ 车辆与行人',
  subtitle: 'v8 原版三型（**有轮**）：蒸汽机动车 / 蒸汽马车 / 双层公共马车 + 行人（1.75 m，头身比 1:6.2）',
  specs: [
    ['蒸汽机动车', `${V.motor.len} × ${V.motor.w} × ${V.motor.h} m · 轮径 ${V.motor.wheelR} m`],
    ['蒸汽马车', `${V.carriage.len} × ${V.carriage.w} × ${V.carriage.h} m · 后轮 ${V.carriage.wheelR} / 前轮 ${V.carriage.wheelFrontR} m`],
    ['双层公共马车', `${V.omnibus.len} × ${V.omnibus.w} × ${V.omnibus.h} m · 轮径 ${V.omnibus.wheelR} m`],
    ['行走方式', '**辐条车轮 ×4**（木轮辋 + 铁箍 + 黄铜轮毂）· 车轮按行驶距离纯滚动'],
    ['蒸汽证据', '卧式锅炉 + 黄铜箍 · 烟囱 · 压力表 · 后置蒸汽机与飞轮'],
    ['尺度参照', '行人 1.75 m（头身比 1:6.2）'],
  ],
  checklist: [
    '三种车是否都是**有轮**的原版形态（轮辋 / 铁箍 / 辐条 / 轮毂 是否齐全）',
    '车轮是否按**行驶距离**滚动（不是按时间空转 —— 会看出发滑）',
    '车体原点是否落在**轮胎触地面**（否则会陷进路面或浮空）',
    '蒸汽证据是否齐全：锅炉 / 烟囱 / 压力表 / 可见飞轮',
    '三种车的尺寸差异是否读得出来（马车 4.2 / 机动车 5.6 / 公共马车 5.4 m）',
    '行人是否读得出"在等"（原地踱步）',
  ],
  options: { pedestal: false, human: false, outline: false, shadows: true, stageOpts: { sunElevation: 36, sunAzimuth: 128 } },
  camera: { pos: [13, 7.5, -19], target: [0, 1.7, 0], fov: 40, shadowCamera: 30, shadowMapSize: 4096 },

  build(ctx) {
    const { stage, extras } = ctx;
    stage.scene.fog.density = 0.0038;
    // 比例参照：一位 1.75 m 行人（与自建行人风格不同，专作尺规）
    board = Vehicles.build({ outline: true });
    return board;
  },

  animation: {
    duration: 24,
    labels: ['静止', '低速 1.2 m/s', '巡航 3.0 m/s', '静止'],
    tick(t, { asset }) {
      // 车速曲线：静止 → 起步 → 巡航 → 收车（都按绝对时间取值，与帧率无关）
      let spd = 0;
      if (t > 4 && t < 8) spd = 1.2 * (t - 4) / 4;
      else if (t >= 8 && t < 18) spd = 1.2 + (3.0 - 1.2) * Math.min(1, (t - 8) / 3);
      else if (t >= 18 && t < 22) spd = Math.max(0, 3.0 * (1 - (t - 18) / 4));
      asset.userData.parts.drive(t, { speed: spd });
      window.__spd = spd;
    },
  },
});
window.__viewer = viewer;

(function presets() {
  const el = document.createElement('div');
  el.id = 'panel';
  el.innerHTML = `
    <h3>视角</h3>
    <div class="btns" id="vs">${Object.keys(VIEWS).map((n) => `<button data-v="${n}">${n}</button>`).join('')}</div>
    <h3>车速（驱动轮转 + 行人踱步）</h3>
    <div class="r"><span class="lb">车速</span><input type="range" id="sp" min="0" max="4" step="0.05" value="0"><span class="st" id="spt">0.0 m/s</span></div>
    <div class="btns">
      <button data-s="0">静止</button><button data-s="1.2">低速</button>
      <button data-s="3.0">巡航</button><button data-s="auto" class="on">随轴</button>
    </div>`;
  document.body.appendChild(el);

  let ovr = null;
  const sp = el.querySelector('#sp'), spt = el.querySelector('#spt');
  const apply = () => {
    const v = ovr ?? window.__spd ?? 0;
    sp.value = v; spt.textContent = v.toFixed(1) + ' m/s';
    board.userData.parts.drive(viewer.stage.elapsed, { speed: v });
  };
  sp.oninput = () => { ovr = parseFloat(sp.value); apply(); };
  el.querySelectorAll('#vs button').forEach((b) => {
    b.onclick = () => {
      const v = VIEWS[b.dataset.v];
      viewer.stage.camera.position.fromArray(v.pos);
      viewer.stage.controls.target.fromArray(v.tgt);
      viewer.stage.controls.update();
    };
  });
  el.querySelectorAll('[data-s]').forEach((b) => {
    b.onclick = () => {
      ovr = b.dataset.s === 'auto' ? null : parseFloat(b.dataset.s);
      el.querySelectorAll('[data-s]').forEach((x) => x.classList.toggle('on', x === b));
      apply();
    };
  });
  apply();
  setInterval(() => { if (ovr === null) apply(); }, 200);
})();

document.getElementById('boot').classList.add('gone');
setTimeout(() => document.getElementById('boot')?.remove(), 600);
</script>
</body>
</html>
