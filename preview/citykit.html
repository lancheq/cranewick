<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRANEWICK · 城市建筑套件</title>
<style>
  html,body{margin:0;height:100%;background:#10141a}
  canvas{display:block}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    color:#D9B26A;font:13px/1.7 "SF Mono",Menlo,monospace;letter-spacing:.1em;z-index:99;
    background:#10141a;transition:opacity .4s}#boot.gone{opacity:0;pointer-events:none}
  #err{position:fixed;inset:0;display:none;padding:40px;color:#E2913C;
    font:12px/1.7 "SF Mono",Menlo,monospace;white-space:pre-wrap;overflow:auto;z-index:100}
  #panel{position:fixed;left:14px;bottom:74px;width:318px;background:rgba(18,22,29,.9);
    border:1px solid rgba(217,178,106,.28);border-radius:8px;padding:10px 12px;z-index:6;
    font:11.5px/1.5 "SF Mono",Menlo,Consolas,"PingFang SC",monospace;color:#E8E4DC}
  #panel h3{margin:0 0 6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:#D9B26A;font-weight:600}#panel h3:not(:first-child){margin-top:9px}
  #panel .btns{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
  #panel button{flex:1 1 auto;min-width:56px;padding:4px 6px;font:inherit;font-size:10.5px;cursor:pointer;
    background:rgba(217,178,106,.07);color:#E8E4DC;border:1px solid rgba(217,178,106,.28);border-radius:5px}
  #panel button:hover{background:rgba(217,178,106,.18)}
  #panel button.on{background:#D9B26A;color:#14181e;border-color:#D9B26A;font-weight:600}
  #scale{position:fixed;left:14px;bottom:250px;width:318px;background:rgba(18,22,29,.9);
    border:1px solid rgba(217,178,106,.22);border-radius:8px;padding:8px 12px;z-index:6;
    font:10.5px/1.65 "SF Mono",Menlo,monospace;color:#9AA3AD}
  #scale b{color:#D9B26A}
</style>
<script type="importmap">
{"imports":{"three":"../vendor/three.module.js","three/addons/":"../vendor/jsm/"}}
</script>
</head>
<body>
<div id="boot">正在装配城市建筑套件 …</div>
<pre id="err"></pre>

<script type="module">
import * as THREE from 'three';
import { createViewer } from '../src/core/viewer.js?v=20260916171456';
import * as CityKit from '../src/assets/citykit.js?v=20260916171456';
import { WORLD, H } from '../src/core/scale.js?v=20260916171456';

const showErr = (m) => { const el = document.getElementById('err'); el.style.display='block'; el.textContent += m + '\n\n'; };
window.addEventListener('error', (e) => showErr(`${e.message}\n  ${e.filename}:${e.lineno}`));
window.addEventListener('unhandledrejection', (e) => showErr('Promise: ' + (e.reason?.stack || e.reason)));

const VIEWS = {
  全景: { pos: [0, 34, 92], tgt: [4, 6, 0] },
  居民楼: { pos: [-46, 12, 8], tgt: [-46, 6, -18] },
  小别墅: { pos: [-24, 8, 40], tgt: [-24, 4, 20] },
  工厂: { pos: [6, 18, 24], tgt: [6, 10, -18] },
  广场: { pos: [6, 12, 58], tgt: [6, 6, 26] },
  尺度参照: { pos: [-40, 4.4, 26], tgt: [-40, 2.2, 14] },
};

const viewer = createViewer({
  title: '城市建筑套件 · 可复用素材',
  subtitle: '居民楼 / 小别墅 / 工厂 / 公园 / 广场 · 蒸汽朋克口径 · 世界尺度已按新口径重设',
  specs: [
    ['基准锚点', `低空悬浮车 长 4.5 m`],
    ['飞艇（世界）', `${WORLD.AIRSHIP.worldLen} m · 实例缩放 1:${(1/WORLD.AIRSHIP.instanceScale).toFixed(1)}`],
    ['居民楼', `${WORLD.CITY.residential.w}×${WORLD.CITY.residential.d} · 3 层 · 层高 ${H.floor}`],
    ['小别墅', `${WORLD.CITY.villa.w}×${WORLD.CITY.villa.d} · 2 层 + 温室`],
    ['工厂', `${WORLD.CITY.factory.w}×${WORLD.CITY.factory.d} · 烟囱 ${WORLD.CITY.factory.stackH} m`],
    ['广场', `${WORLD.CITY.plaza.w}×${WORLD.CITY.plaza.d} · 中央发电塔`],
    ['行人', `${H.human} m`],
  ],
  checklist: [
    '风格是否落到"蒸汽朋克"：外露动力 / 可动机构 / 黄铜+铸铁+压力容器 三者是否可见',
    '有没有回潮到哥特：尖拱 / 尖塔 / 雉堞 / 纯石体量（出现即不合格）',
    '墙面是否为砖石贴图（纯色块不合格）',
    '整体明度：黄铜是否有「璀璨」的高光带，而不是发闷'+
      '（本页已改：palette 加金属专用 4 段色阶 + 边缘光改暖金）',
    '与 4.5 m 车代理的比例是否合理（门高 2.1 应比车顶高一截）',
    '每类建筑是否**参数可出变体**（改 floors/bays/seed 应出不同样子）',
    '可动件（别墅风向标 / 广场发电塔飞轮+连杆 / 工厂流水线）是否读得出来',
    '五类的城市语言是否统一（街灯、栏杆、管线是否同族）',
  ],
  options: { pedestal: false, human: false, outline: false, shadows: true, stageOpts: { sunElevation: 30, sunAzimuth: 146 } },
  camera: { pos: [0, 34, 92], target: [4, 6, 0], fov: 40, shadowCamera: 120, shadowMapSize: 4096 },

  build(ctx) {
    const { stage } = ctx;
    stage.scene.fog.density = 0.0032;
    return CityKit.build({ outline: true });
  },

  animation: {
    duration: 24,
    labels: ['风向标转', '纪念塔重锤往复', '龙门吊小车移动'],
    tick(t, { asset }) { asset.userData.parts.drive(t); },
  },
});
window.__viewer = viewer;

(function panel() {
  const el = document.createElement('div');
  el.id = 'panel';
  el.innerHTML = `
    <h3>视角</h3>
    <div class="btns">${Object.keys(VIEWS).map((n) => `<button data-v="${n}">${n}</button>`).join('')}</div>`;
  document.body.appendChild(el);
  const sc = document.createElement('div');
  sc.id = 'scale';
  const r = WORLD.ratios();
  sc.innerHTML = `<b>比例自检</b>（基准：车 ${r.车} m）<br>
    飞艇 ${r.飞艇} m ＝ ${r.飞艇_比车}× 车长<br>
    运河宽 ${r.运河宽_比车}× 车长 · 桥净跨 ${r.桥净跨_比车}× 车长<br>
    桥面宽 ${r.桥面宽} m · 街道总宽 ${r.街道总宽} m`;
  document.body.appendChild(sc);
  el.querySelectorAll('button').forEach((b) => {
    b.onclick = () => {
      const v = VIEWS[b.dataset.v];
      viewer.stage.camera.position.fromArray(v.pos);
      viewer.stage.controls.target.fromArray(v.tgt);
      viewer.stage.controls.update();
      el.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
    };
  });
})();

document.getElementById('boot').classList.add('gone');
setTimeout(() => document.getElementById('boot')?.remove(), 700);
</script>
</body>
</html>
