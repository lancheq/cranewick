<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRANEWICK · 单体 ② 开启桥</title>
<style>
  html,body{margin:0;height:100%;background:#10141a}
  canvas{display:block}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    color:#D9B26A;font:13px/1.6 "SF Mono",Menlo,monospace;letter-spacing:.1em;z-index:99;
    background:#10141a;transition:opacity .4s}
  #boot.gone{opacity:0;pointer-events:none}
  #err{position:fixed;inset:0;display:none;padding:40px;color:#E2913C;
    font:12px/1.7 "SF Mono",Menlo,monospace;white-space:pre-wrap;overflow:auto;z-index:100}
  #panel{position:fixed;left:14px;bottom:74px;width:326px;background:rgba(18,22,29,.9);
    border:1px solid rgba(217,178,106,.28);border-radius:8px;padding:10px 12px;z-index:6;
    font:11.5px/1.5 "SF Mono",Menlo,Consolas,"PingFang SC",monospace;color:#E8E4DC}
  #panel h3{margin:0 0 6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:#D9B26A;font-weight:600}
  #panel h3:not(:first-child){margin-top:9px}
  #panel .r{display:flex;align-items:center;gap:8px;margin:3px 0}
  #panel .lb{color:#9AA3AD;font-size:10.5px;width:34px}
  #panel input[type=range]{flex:1;accent-color:#D9B26A}
  #panel .st{color:#9AA3AD;font-size:10.5px;width:72px;text-align:right}
  #panel .btns{display:flex;gap:6px;margin-top:5px}
  #panel button{flex:1;padding:4px 6px;font:inherit;font-size:10.5px;cursor:pointer;
    background:rgba(217,178,106,.07);color:#E8E4DC;border:1px solid rgba(217,178,106,.28);
    border-radius:5px;white-space:nowrap}
  #panel button:hover{background:rgba(217,178,106,.18)}
  #panel button.on{background:#D9B26A;color:#14181e;border-color:#D9B26A;font-weight:600}
</style>
<script type="importmap">
{
  "imports": {
    "three": "../vendor/three.module.js",
    "three/addons/": "../vendor/jsm/"
  }
}
</script>
</head>
<body>
<div id="boot">正在装配 CRANEWICK BRIDGE …</div>
<pre id="err"></pre>

<script type="module">
import * as THREE from 'three';
import { createViewer } from '../src/core/viewer.js?v=20260916192634';
import { createWater } from '../src/scene/water.js?v=20260916192634';
import * as Bridge from '../src/assets/bridge.js?v=20260916192634';

const showErr = (m) => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent += m + '\n\n'; };
window.addEventListener('error', (e) => showErr(`${e.message}\n  ${e.filename}:${e.lineno}`));
window.addEventListener('unhandledrejection', (e) => showErr('Promise: ' + (e.reason?.stack || e.reason)));

const SP = Bridge.SPEC;
const DUR = 52;
// 相位（秒）——对应 docs/SHOT_SCRIPT.md 相位 1–8，压缩演示
const T = {
  normal: 0, warn: 6, clear: 12, confirm: 17, unlock: 20,
  open: 23, openEnd: 23 + SP.openDeg / SP.openRate,  // 23 + 20 = 43
  green: 43, hold: 47, closeStart: 47, end: 52,
};
const smooth = (u) => { const x = Math.min(1, Math.max(0, u)); return x * x * (3 - 2 * x); };
const seg = (t, a, b) => smooth((t - a) / (b - a));

let water;

const viewer = createViewer({
  title: '② 开启桥 · CRANEWICK BRIDGE',
  subtitle: '18 m 净跨通车路桥 · 开 70°/12.5 s · 外露板梁与液压蓄能器 · 封道→清空→确认→开桥',
  specs: [
    ['净跨 / 单叶', '18 m / 9 m'],
    ['桥面', '9.36 × 0.9 m · 顶标高 2.8'],
    ['车行道 / 人行道', '6.6（双车道）/ 1.38 ×2'],
    ['开启角 / 速度', '70° · 5.6 °/s（12.5 s）'],
    ['机械塔架', '6.4 m 四腿铆接钢桁架 ×2（无城堡塔）'],
    ['起桥动力', '液压蓄能器 + 24/18/12 齿轮组 + 配重钢索'],
    ['配重 / 行程', '26 t ×2 / 4.4 m'],
    ['封道栏杆落杆', '4.0 s（92° → 0°）'],
    ['尺度参照', '悬浮车 4.5 m / 行人 1.75 m'],
  ],
  checklist: [
    '是不是"通车路桥"：车行道 + 人行道 + 路缘 + 栏杆 是否齐全',
    '有没有回潮成城堡：尖塔 / 雉堞 / 实心石墙（出现即不合格）',
    '主体结构是否"看得穿"：外露铆接板梁 + 腹板加劲肋 + 桁架',
    '起桥动力是否外露可读：液压蓄能器 / 齿轮组 / 配重 是否看得出推向桥叶',
    '桥叶开启 70° 时中缝是否让出航道，配重是否随动',
    '封道系统：黄黑斜纹栏杆 + 警示牌警钟 + 指示灯四态',
  ],
  options: { pedestal: false, human: true, outline: false, shadows: true, humanPos: [0, SP.deckY, 14] },
  camera: { pos: [138, 74, 186], target: [0, 34, 0], fov: 40, shadowCamera: 150 },

  build(ctx) {
    const { stage, extras } = ctx;
    // 河水：不跟随相机（桥不动），极坐标网格以桥为中心
    water = createWater({ rings: 110, sectors: 180, rMin: 0.6, rMax: 1600, followCamera: false });
    water.mesh.position.set(0, 0, 0);
    stage.scene.add(water.mesh);
    stage.scene.fog.density = 0.0021;
    return Bridge.build({ outline: true });
  },

  animation: {
    duration: DUR,
    labels: ['常态', '预告·落杆', '清空桥面', '净空确认', '解锁', '开桥 70°', '绿灯', '回落'],
    tick(t, { stage, asset }) {
      water.update(t, stage.camera);
      const P = asset.userData.parts;

      // ---- 状态解析（按绝对时间，与帧率无关）----
      // 栏杆：常态抬起 → 6.5 s 起 5.5 s 下落 → 保持落定
      const gateT = t < T.warn + 0.5 ? 0 : seg(t, T.warn + 0.5, T.warn + 0.5 + SP.gateDrop);
      // 桥叶：解锁后 20 s 开满；保持；最后 5 s 回落
      let leaf;
      if (t < T.open) leaf = 0;
      else if (t < T.openEnd) leaf = SP.openDeg * ((t - T.open) / (T.openEnd - T.open));
      else if (t < T.closeStart) leaf = SP.openDeg;
      else leaf = SP.openDeg * (1 - (t - T.closeStart) / (T.end - T.closeStart));
      // 配重：与桥叶同步（0 → 1）
      const cwT = THREE.MathUtils.clamp(leaf / SP.openDeg, 0, 1);
      // 栏杆分段收起：解锁阶段（20–23 s）
      const railRetract = seg(t, T.unlock, T.unlock + 3);
      // 指示灯四态
      let sig = 'red';
      if (t >= T.warn && t < T.warn + 6) sig = 'red-blink';
      else if (t >= T.unlock && t < T.green) sig = 'amber-blink';
      else if (t >= T.green && t < T.closeStart) sig = 'green';
      else if (t >= T.closeStart) sig = 'amber-blink';
      // 机构转速：解锁前静止，开桥期间额定
      const mechRpm = t >= T.unlock && t <= T.closeStart + 1 ? 34 : 0;
      const bellSwing = t >= T.warn - 0.3 && t < T.open ? 22 : 0;

      P.drive(t, { leafDeg: leaf, cwT, gateT, railRetract, signal: sig, mechRpm, bellSwing });
      window.__st = { t, leaf, cwT, gateT, railRetract, sig, mechRpm };
    },
  },
});

window.__viewer = viewer;

// ---------------------------------------------------------------------------
// 手动检查面板
// ---------------------------------------------------------------------------
(function panel() {
  const el = document.createElement('div');
  el.id = 'panel';
  el.innerHTML = `
    <h3>桥叶 / 配重</h3>
    <div class="r"><span class="lb">桥叶</span><input type="range" id="lf" min="0" max="78" step="0.5" value="0"><span class="st" id="lft">闭合 0°</span></div>
    <div class="btns">
      <button data-a="leaf" data-v="0">闭合</button>
      <button data-a="leaf" data-v="39">半开</button>
      <button data-a="leaf" data-v="78">全开 78°</button>
      <button data-a="auto">随轴</button>
    </div>
    <h3>封道栏杆</h3>
    <div class="r"><span class="lb">栏杆</span><input type="range" id="gt" min="0" max="1" step="0.01" value="0"><span class="st" id="gtt">抬起</span></div>
    <div class="r"><span class="lb">栏杆分段</span><input type="range" id="rl" min="0" max="1" step="0.01" value="0"><span class="st" id="rlt">架好</span></div>
    <h3>指示灯</h3>
    <div class="btns">
      <button data-a="sig" data-v="red" class="on">红常亮</button>
      <button data-a="sig" data-v="red-blink">红闪 1.0Hz</button>
      <button data-a="sig" data-v="amber-blink">琥珀闪 1.5Hz</button>
      <button data-a="sig" data-v="green">绿常亮</button>
    </div>`;
  document.body.appendChild(el);

  let ovr = { leaf: null, gate: null, rail: null, sig: null };
  const lf = el.querySelector('#lf'), lft = el.querySelector('#lft');
  const gt = el.querySelector('#gt'), gtt = el.querySelector('#gtt');
  const rl = el.querySelector('#rl'), rlt = el.querySelector('#rlt');

  function apply() {
    const P = viewer.asset.userData.parts;
    const s = {
      leafDeg: ovr.leaf ?? window.__st?.leaf ?? 0,
      cwT: (ovr.leaf ?? window.__st?.leaf ?? 0) / SP.openDeg,
      gateT: ovr.gate ?? window.__st?.gateT ?? 0,
      railRetract: ovr.rail ?? window.__st?.railRetract ?? 0,
      signal: ovr.sig ?? window.__st?.sig ?? 'red',
      mechRpm: ovr.leaf !== null ? 0 : (window.__st?.mechRpm ?? 0),
      bellSwing: window.__st?.bellSwing ?? 0,
    };
    P.drive(viewer.stage.elapsed, s);
    lf.value = s.leafDeg;
    lft.textContent = s.leafDeg < 0.5 ? '闭合 0°' : `${s.leafDeg.toFixed(0)}°`;
    gt.value = s.gateT; gtt.textContent = s.gateT < 0.02 ? '抬起' : s.gateT > 0.98 ? '落定' : '下落中';
    rl.value = s.railRetract; rlt.textContent = s.railRetract < 0.02 ? '架好' : s.railRetract > 0.98 ? '已收起' : '收起中';
  }
  lf.oninput = () => { ovr.leaf = parseFloat(lf.value); apply(); };
  gt.oninput = () => { ovr.gate = parseFloat(gt.value); apply(); };
  rl.oninput = () => { ovr.rail = parseFloat(rl.value); apply(); };
  el.querySelectorAll('button').forEach((b) => {
    b.onclick = () => {
      const a = b.dataset.a, v = b.dataset.v;
      if (a === 'auto') { ovr = { leaf: null, gate: null, rail: null, sig: null };
        el.querySelectorAll('button').forEach((x) => x.classList.remove('on')); return; }
      if (a === 'leaf') ovr.leaf = parseFloat(v);
      if (a === 'sig') {
        ovr.sig = v;
        el.querySelectorAll('button[data-a=sig]').forEach((x) => x.classList.remove('on'));
        b.classList.add('on');
      }
      apply();
    };
  });
  apply();
  setInterval(() => { if (ovr.leaf === null) apply(); }, 200);
})();

document.getElementById('boot').classList.add('gone');
setTimeout(() => document.getElementById('boot')?.remove(), 600);
</script>
</body>
</html>
