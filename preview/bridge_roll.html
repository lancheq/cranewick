<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRANEWICK · 开启桥 滚开式（可动钢桁架）</title>
<style>
  html,body{margin:0;height:100%;background:#10141a}
  canvas{display:block}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    color:#D9B26A;font:13px/1.6 "SF Mono",Menlo,monospace;letter-spacing:.1em;z-index:99;
    background:#10141a;transition:opacity .4s}
  #boot.gone{opacity:0;pointer-events:none}
  #err{position:fixed;inset:0;display:none;padding:40px;color:#E2913C;
    font:12px/1.7 "SF Mono",Menlo,monospace;white-space:pre-wrap;overflow:auto;z-index:100}
  #panel{position:fixed;left:14px;bottom:74px;width:336px;background:rgba(18,22,29,.9);
    border:1px solid rgba(217,178,106,.28);border-radius:8px;padding:10px 12px;z-index:6;
    font:11.5px/1.5 "SF Mono",Menlo,Consolas,"PingFang SC",monospace;color:#E8E4DC}
  #panel h3{margin:0 0 6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:#D9B26A;font-weight:600}
  #panel h3:not(:first-child){margin-top:9px}
  #panel .r{display:flex;align-items:center;gap:8px;margin:3px 0}
  #panel .lb{color:#9AA3AD;font-size:10.5px;width:52px}
  #panel input[type=range]{flex:1;accent-color:#D9B26A}
  #panel .st{color:#9AA3AD;font-size:10.5px;width:96px;text-align:right}
  #panel .btns{display:flex;gap:6px;margin-top:5px}
  #panel button{flex:1;padding:4px 6px;font:inherit;font-size:10.5px;cursor:pointer;
    background:rgba(217,178,106,.07);color:#E8E4DC;border:1px solid rgba(217,178,106,.28);
    border-radius:5px;white-space:nowrap}
  #panel button:hover{background:rgba(217,178,106,.18)}
  #panel button.on{background:#D9B26A;color:#14181e;border-color:#D9B26A;font-weight:600}
</style>
<script type="importmap">
{
  "imports": {
    "three": "../vendor/three.module.js",
    "three/addons/": "../vendor/jsm/"
  }
}
</script>
</head>
<body>
<div id="boot">正在装配 CRANEWICK ROLLING BRIDGE …</div>
<pre id="err"></pre>

<script type="module">
import * as THREE from 'three';
import { createViewer } from '../src/core/viewer.js?v=20260915152358';
import { createWater } from '../src/scene/water.js?v=20260915152358';
import * as Roll from '../src/assets/bridge_roll.js?v=20260915152358';

const showErr = (m) => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent += m + '\n\n'; };
window.addEventListener('error', (e) => showErr(`${e.message}\n  ${e.filename}:${e.lineno}`));
window.addEventListener('unhandledrejection', (e) => showErr('Promise: ' + (e.reason?.stack || e.reason)));

const SP = Roll.SPEC;
const DUR = 52;
const T = {
  normal: 0, warn: 6, clear: 12, confirm: 17, unlock: 20,
  open: 23, openEnd: 23 + SP.openDeg / SP.openRate,   // 23 + 12.5 = 35.5
  green: 35.5, closeStart: 44, end: 52,
};
const smooth = (u) => { const x = Math.min(1, Math.max(0, u)); return x * x * (3 - 2 * x); };
const seg = (t, a, b) => smooth((t - a) / (b - a));

let water;

const viewer = createViewer({
  title: '②b 开启桥 · 滚开式可动钢桁架（对比版）',
  subtitle: '下承式钢桁架 · 边转边沿轨道后退（后退量 = R·θ）· 配重下落入坑 · **桥面以上无任何构件**',
  specs: [
    ['净跨 / 单叶', `${SP.span} m / ${SP.leafLen} m`],
    ['桥面', `${SP.deckW} × ${SP.deckT} m · 顶标高 ${SP.deckY}`],
    ['车行道 / 人行道', `${SP.roadW}（双车道）/ ${SP.walkW} ×2`],
    ['主桁架', `下承式 · 高 ${SP.trussH} m · ${SP.bays} 节间 · 节点板`],
    ['滚弧半径 R', `${SP.quadrantR} m`],
    ['后退行程', `R·θ = ${SP.quadrantR} × ${(SP.openDeg * Math.PI / 180).toFixed(3)} = ${(SP.quadrantR * SP.openDeg * Math.PI / 180).toFixed(2)} m`],
    ['开启角 / 速度', `${SP.openDeg}° · ${SP.openRate} °/s（12.5 s）`],
    ['驱动', '液压缸推桥叶耳板 + 蓄能器 + 外露齿轮组'],
    ['通道净空', '桥面以上 0 构件（无塔架、无门架、无立杆）'],
    ['尺度参照', '悬浮车 4.5 m / 行人 1.75 m'],
  ],
  checklist: [
    '有没有"竖起来的东西"：塔架 / 门架 / 立杆 / 尖塔（出现即不合格）',
    '是否读得出"滚"而不是"转"：枢轴后退量 = R·θ，接触点沿齿弧走 0→70°',
    '滚弧齿板是否是**一段圆弧**（不是圆盘/不是方形支架）',
    '配重是否随开桥**下落入桥台坑**，坑是否看得出来',
    '主桁架是否"看得穿"：上下弦 + 竖斜杆 + 节点板 + 上弦平联',
    '桥面是否仍是通车路桥：车行道 + 人行道 + 路缘 + 栏杆 + 中心线',
    '桥台是否只是低矮石作（不是塔基），压顶石与河堤同语言',
  ],
  options: { pedestal: false, human: true, outline: false, shadows: true, humanPos: [0, SP.deckY, 13] },
  camera: { pos: [30, 14, 40], target: [0, SP.deckY - 0.4, 0], fov: 42, shadowCamera: 110 },

  build(ctx) {
    const { stage } = ctx;
    water = createWater({ rings: 110, sectors: 180, rMin: 0.6, rMax: 1600, followCamera: false });
    water.mesh.position.set(0, 0, 0);
    stage.scene.add(water.mesh);
    stage.scene.fog.density = 0.0032;   // 世界尺度比既有桥小得多，雾要相应加浓
    return Roll.build({ outline: true });
  },

  animation: {
    duration: DUR,
    labels: ['常态', '预告·落杆', '清空桥面', '净空确认', '解锁', '滚开中', '全开 70°', '回落'],
    tick(t, { stage, asset }) {
      water.update(t, stage.camera);
      const P = asset.userData.parts;

      // 开度：解锁后 12.5 s 开满；保持；最后 8 s 回落
      let openT;
      if (t < T.open) openT = 0;
      else if (t < T.openEnd) openT = (t - T.open) / (T.openEnd - T.open);
      else if (t < T.closeStart) openT = 1;
      else openT = 1 - (t - T.closeStart) / (T.end - T.closeStart);
      openT = Math.min(1, Math.max(0, openT));
      const mechRpm = (t >= T.unlock && t <= T.closeStart + 1) ? 30 : 0;

      P.drive(t, { openT: openT < 0.001 ? 0 : openT, mechRpm });
      window.__st = Object.assign(P.snapshot(), { t, openT });
    },
  },
});

window.__viewer = viewer;

// ---------------------------------------------------------------------------
// 拍板面板
// ---------------------------------------------------------------------------
(function panel() {
  const el = document.createElement('div');
  el.id = 'panel';
  el.innerHTML = `
    <h3>开度（滚开量）</h3>
    <div class="r"><span class="lb">开度</span><input type="range" id="ot" min="0" max="1" step="0.005" value="0"><span class="st" id="ott">闭合 0°</span></div>
    <div class="r"><span class="lb">后退量</span><span class="st" id="rbt" style="width:auto;flex:1;text-align:left;color:#E8E4DC">0.00 m</span></div>
    <div class="btns">
      <button data-a="open" data-v="0">闭合</button>
      <button data-a="open" data-v="0.5">半开 35°</button>
      <button data-a="open" data-v="1">全开 70°</button>
      <button data-a="auto" class="on">随轴</button>
    </div>
    <h3>视角</h3>
    <div class="btns">
      <button data-a="view" data-v="全景">全景</button>
      <button data-a="view" data-v="侧视">侧视机构</button>
      <button data-a="view" data-v="低位">低位看净空</button>
    </div>
    <div class="btns">
      <button data-a="view" data-v="桥面">桥面</button>
      <button data-a="view" data-v="中缝">中缝</button>
      <button data-a="view" data-v="俯视">俯视</button>
    </div>`;
  document.body.appendChild(el);

  const VIEWS = {
    全景: { pos: [30, 14, 40], tgt: [0, SP.deckY - 0.4, 0] },
    侧视: { pos: [14, 7.4, 26], tgt: [10.5, 1.2, 0] },
    低位: { pos: [1.5, 1.1, 30], tgt: [0, SP.deckY, -2] },
    桥面: { pos: [4.5, SP.deckY + 1.9, 12], tgt: [-6, SP.deckY + 2.0, -3] },
    中缝: { pos: [0, SP.deckY + 2.4, 8], tgt: [0, SP.deckY + 0.6, -1] },
    俯视: { pos: [3, 24, 18], tgt: [0, 1.4, -1] },
  };

  let ovrOpen = null;
  const ot = el.querySelector('#ot'), ott = el.querySelector('#ott'), rbt = el.querySelector('#rbt');

  function apply() {
    const P = viewer.asset.userData.parts;
    const s = window.__st || P.snapshot();
    const v = ovrOpen === null ? (s.openT ?? 0) : ovrOpen;
    P.setOpenT(v);
    ot.value = v;
    const deg = v * SP.openDeg;
    ott.textContent = deg < 0.5 ? '闭合 0°' : `${deg.toFixed(1)}°`;
    rbt.textContent = `${(v * SP.quadrantR * SP.openDeg * Math.PI / 180).toFixed(2)} m / ${(SP.quadrantR * SP.openDeg * Math.PI / 180).toFixed(2)} m`;
  }
  ot.oninput = () => { ovrOpen = parseFloat(ot.value); apply(); };
  el.querySelectorAll('button').forEach((b) => {
    b.onclick = () => {
      const a = b.dataset.a, v = b.dataset.v;
      if (a === 'open') { ovrOpen = parseFloat(v); apply(); }
      if (a === 'auto') {
        ovrOpen = null;
        el.querySelectorAll('button[data-a=open]').forEach((x) => x.classList.remove('on'));
        b.classList.add('on');
        apply();
      }
      if (a === 'view') {
        const w = VIEWS[v];
        if (w) {
          viewer.stage.camera.position.fromArray(w.pos);
          viewer.stage.controls.target.fromArray(w.tgt);
          viewer.stage.controls.update();
        }
      }
    };
  });
  apply();
  setInterval(() => { if (ovrOpen === null) apply(); }, 180);
})();

document.getElementById('boot').classList.add('gone');
setTimeout(() => document.getElementById('boot')?.remove(), 600);
</script>
</body>
</html>
